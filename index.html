<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>준&amp;하진이네 가족어플</title>

<!-- 홈 화면 아이콘 / 앱처럼 실행되도록 하는 설정 -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="theme-color" content="#4c6ef5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가족어플">

<!-- 비밀번호 잠금 판정.
     화면이 잠깐 보였다 가려지는 것을 막으려고 본문보다 먼저 실행한다.
     비밀번호는 변환한 값만 저장한다 — 공개 저장소에 그대로 적히지 않도록. -->
<script>
window.LOCK = (function(){
  function hash(code){
    let h = 0x811c9dc5;
    const s = 'lhk-family:' + code;
    for (let i = 0; i < s.length; i++){
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(36);
  }
  const KEY = 'family-unlock-v1';
  const ADMIN = 'blxhnu';    // 관리자 — 공지사항을 고칠 수 있다
  const USER  = '1h1dtow';   // 일반 이용자 — 보기만 한다
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}

  const root = document.documentElement;
  if (saved !== ADMIN && saved !== USER) root.classList.add('locked');
  if (saved === ADMIN) root.classList.add('admin');

  return {
    KEY, ADMIN, USER, hash,
    roleOf: code => (code === ADMIN ? 'admin' : code === USER ? 'user' : null),
    isAdmin: () => root.classList.contains('admin'),
  };
})();
</script>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e3e8f0; --text:#1a2233; --muted:#7a8699;
    --accent:#4c6ef5; --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
    --dad:#3b82f6; --mom:#ec4899; --jun:#10b981; --hajin:#f59e0b;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --card:#1a1f29; --line:#2a3140; --text:#e8ecf3; --muted:#8e9aae;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  /* 화면이 밀려 들어올 때 가로 스크롤바가 잠깐 생기지 않도록 */
  body{overflow-x:hidden}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 64px}

  /* ---- 비밀번호 잠금 ---- */
  .lock{display:none}
  :root.locked .wrap{visibility:hidden}
  :root.locked body{overflow:hidden}
  :root.locked .lock{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    position:fixed;inset:0;z-index:100;background:var(--bg);padding:24px;text-align:center;
  }
  .lock-logo{width:78px;height:78px;border-radius:20px;box-shadow:var(--shadow)}
  .lock h2{margin:6px 0 0;font-size:19px;letter-spacing:-.4px}
  .lock-sub{margin:0;font-size:13.5px;color:var(--muted)}
  #lockInput{
    width:190px;font:inherit;font-size:26px;font-weight:700;letter-spacing:10px;
    text-align:center;padding:12px 10px 12px 20px;border-radius:14px;
    border:1px solid var(--line);background:var(--card);color:var(--text);
  }
  #lockInput:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .lock-msg{font-size:12.5px;color:var(--muted);min-height:18px}
  .lock-msg.err{color:#ef4444;font-weight:600}
  .lock.shake{animation:shake .35s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%,60%{transform:translateX(-9px)}
    40%,80%{transform:translateX(9px)}
  }

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:22px;margin:0;letter-spacing:-.4px}
  .head-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px}
  .today-label{font-size:13px;color:var(--muted)}

  .sync{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);
    white-space:nowrap;cursor:default}
  .sync i{width:8px;height:8px;border-radius:50%;flex:none}

  .tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line)}
  .tabs button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;
    padding:8px 16px;border-radius:9px;cursor:pointer;transition:.15s;
  }
  .tabs button.on{background:var(--accent);color:#fff}

  /* 상단(제목·탭·공지)은 그대로 두고 이 영역만 한 장씩 넘어간다.
     clip 은 hidden 과 달리 세로 스크롤을 막지 않는다. */
  .panels{position:relative;overflow-x:clip}
  .panel{display:none}
  .panel.on{display:block;animation:tabIn .26s cubic-bezier(.25,.8,.3,1)}
  /* 나가는 화면은 자리를 차지하지 않게 띄워두고 밀어낸다 */
  .panel.leaving{
    display:block;position:absolute;top:0;left:0;right:0;pointer-events:none;
    animation:tabOut .26s cubic-bezier(.25,.8,.3,1) forwards;
  }
  @keyframes tabIn{
    from{transform:translateX(var(--slide,100%))}
    to{transform:translateX(0)}
  }
  @keyframes tabOut{
    from{transform:translateX(0);opacity:1}
    to{transform:translateX(var(--slide,-100%));opacity:0}
  }
  @media (prefers-reduced-motion: reduce){
    .panel.on{animation:none}
    .panel.leaving{display:none}
  }

  /* ---- 오늘 ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
  .card-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .card h3{margin:0;font-size:17px;display:flex;align-items:center;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .status{font-size:12px;font-weight:700;color:var(--c)}
  .times{display:flex;gap:10px}
  .time-box{flex:1;background:var(--bg);border-radius:11px;padding:9px 11px;
    cursor:text;min-width:0;transition:box-shadow .15s}
  .time-box:focus-within{box-shadow:0 0 0 2px var(--c)}
  .time-box small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  .time-edit{
    display:block;width:100%;min-width:0;font:inherit;font-size:19px;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:var(--text);
    background:transparent;border:0;padding:0;
  }
  .time-edit:focus{outline:none}
  .time-edit::placeholder{color:var(--muted);font-weight:500;letter-spacing:0}
  .time-edit.bad{color:#ef4444}
  /* 시간과 하고싶은 말 사이 — 배지가 두 줄까지 들어갈 자리를 늘 비워둔다.
     카드가 늘어날 때 남는 공간도 여기로 모인다. */
  .card-badges{display:flex;gap:5px;flex-wrap:wrap;align-content:flex-start;
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    flex:1;min-height:42px}
  .card-badges:empty{border-top-style:dotted}
  .say{display:flex;align-items:flex-start;gap:6px;margin-top:8px;padding:0 2px}
  .say-icon{font-size:13px;line-height:1.6;flex:none;opacity:.7}
  .say-input{
    flex:1;min-width:0;font:inherit;font-size:12.5px;line-height:1.35;padding:6px 9px;
    border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);
    resize:none;overflow:auto;
  }
  .say-input::placeholder{color:var(--muted);opacity:.75}
  .say-input:focus{outline:2px solid var(--c);outline-offset:-1px;border-color:transparent;
    background:var(--card)}

  .empty{color:var(--muted);font-size:14px;padding:8px 0}

  /* ---- 오늘의 한자 · 영어 ---- */
  /* --row-h 하나로 발음 버튼 크기와 줄 높이를 함께 정한다.
     그래야 발음 버튼이 없는 한자 칸도 영어 칸과 줄 간격이 똑같아진다. */
  .words{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;flex:none;
    --row-h:32px}
  .word-box{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;box-shadow:var(--shadow);min-width:0}
  .word-label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.4px;
    color:var(--muted);margin-bottom:6px}
  .word-row{display:flex;align-items:center;gap:7px;min-width:0;min-height:var(--row-h)}
  /* 구분선을 테두리로 그리면 그만큼 줄 높이가 늘어 한자 칸과 영어 칸이 어긋난다.
     높이에 영향을 주지 않는 배경선으로 그린다. */
  .word-row + .word-row{
    margin-top:5px;
    background:linear-gradient(var(--line), var(--line)) top/100% 1px no-repeat;
  }
  .word-row b{font-size:15px;font-weight:700;flex:none;white-space:nowrap}
  .word-row small{font-size:12px;color:var(--muted);flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hanja-char{font-size:26px;font-weight:700;line-height:1.1;flex:none;width:32px;
    text-align:center;font-family:"Malgun Gothic","Apple SD Gothic Neo",serif}
  .eng-w{letter-spacing:-.3px;font-size:17px}
  .eng-w.idiom{font-size:14px}
  .speak{
    flex:none;margin-left:auto;width:var(--row-h);height:var(--row-h);border-radius:50%;
    border:1px solid var(--line);background:var(--bg);font-size:15px;
    cursor:pointer;transition:.15s;
  }
  .speak:hover{border-color:var(--accent)}
  .speak.on{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}

  /* ---- 공지사항 ---- */
  .notice{display:flex;align-items:center;gap:10px;background:#fffbeb;border:1px solid #fde68a;
    border-radius:14px;padding:11px 14px;margin-bottom:18px}
  @media (prefers-color-scheme: dark){
    .notice{background:#2a2418;border-color:#5c4a1a}
  }
  :root[data-theme="dark"] .notice{background:#2a2418;border-color:#5c4a1a}
  :root[data-theme="light"] .notice{background:#fffbeb;border-color:#fde68a}
  .notice-body{flex:1;min-width:0;cursor:text}
  .notice-title{
    display:block;font-size:16px;font-weight:800;letter-spacing:-.2px;color:#b45309;
    margin-bottom:5px;
  }
  @media (prefers-color-scheme: dark){ .notice-title{color:#fbbf24} }
  :root[data-theme="dark"] .notice-title{color:#fbbf24}
  :root[data-theme="light"] .notice-title{color:#b45309}
  .notice-text{font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .notice-text.blank{color:var(--muted)}
  .notice textarea{
    flex:1;font:inherit;font-size:13.5px;line-height:1.6;padding:9px 10px;border-radius:9px;
    border:1px solid var(--line);background:var(--card);color:var(--text);resize:vertical;
    min-height:74px;min-width:0;
  }
  .notice textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .notice-tools{display:flex;flex-direction:column;gap:5px;flex:none}
  .notice-tools .btn{padding:5px 10px;font-size:12px}

  /* ---- 기분 (버튼 → 팝업) ---- */
  .mood-pick{display:flex;margin:0 0 9px;flex:none}
  .mood-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;
    font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:20px;cursor:pointer;
    transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mood-btn:hover{border-color:var(--muted);color:var(--text)}
  .mood-btn .em{font-size:15px;line-height:1;flex:none}
  .mood-btn.on{background:var(--mb);border-color:transparent;color:var(--mf);font-weight:700}

  #moodDlg{max-width:340px;width:calc(100vw - 36px)}
  #moodDlg h3{margin:0;font-size:17px}
  .mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
  .mood-opt{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);
    color:var(--text);font:inherit;font-size:13px;font-weight:600;padding:11px 10px;
    border-radius:12px;cursor:pointer;transition:.15s;
  }
  .mood-opt:hover{border-color:var(--muted)}
  .mood-opt .em{font-size:20px;line-height:1;flex:none}
  .mood-opt.on{background:var(--mb);color:var(--mf);border-color:transparent;font-weight:800}
  .mood-opt:last-child{grid-column:1/-1;justify-content:center}

  /* ---- 주간 ---- */
  .member-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .member-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .member-head h3{margin:0;font-size:16px}
  .member-head .tools{margin-left:auto;display:flex;gap:6px}
  .btn{
    border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;font-size:12px;
    font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s;
  }
  .btn:hover{color:var(--text);border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;min-width:320px}
  th,td{padding:6px 4px;text-align:center}
  th{font-size:12px;color:var(--muted);font-weight:600}
  th:first-child,td:first-child{text-align:left;width:64px;font-size:13px;color:var(--muted)}
  tr.weekend th, tr.weekend td:first-child{color:#ef4444}
  tr.today{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  tr.today td:first-child{font-weight:700;color:var(--accent)}
  input[type=time]{
    width:100%;min-width:104px;font:inherit;font-size:14px;font-variant-numeric:tabular-nums;
    padding:7px 8px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);color:var(--text);text-align:center;
  }
  input[type=time]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  input[type=time]:invalid{box-shadow:none}
  .ox{
    width:100%;max-width:54px;border:1px solid var(--line);background:var(--bg);color:var(--muted);
    font:inherit;font-size:14px;font-weight:800;padding:7px 0;border-radius:9px;cursor:pointer;transition:.15s;
  }
  .ox:hover{border-color:var(--ox,var(--muted))}
  .ox.on{background:var(--ox,#6366f1);border-color:var(--ox,#6366f1);color:#fff}
  .acad-wrap{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-width:96px}
  .acad{
    border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;
    font-size:11px;font-weight:700;padding:5px 7px;border-radius:7px;cursor:pointer;transition:.15s;
  }
  .acad:hover{border-color:#a855f7;color:var(--text)}
  .acad.on{background:#7e22ce;border-color:#7e22ce;color:#fff}

  .footer-bar{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .saved{font-size:12px;color:var(--muted);margin-right:auto;align-self:center}

  /* ---- 월간 ---- */
  .cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .cal-title{font-size:17px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .cal-nav{margin-left:auto;display:flex;gap:6px}
  .cal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow{padding:9px 0;text-align:center;font-size:12px;font-weight:700;color:var(--muted);
    border-bottom:1px solid var(--line)}
  .dow.sun{color:#ef4444}
  .dow.sat{color:#3b82f6}
  .cell{min-height:94px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:5px;cursor:pointer;transition:background .12s;display:flex;flex-direction:column;gap:3px}
  .cell:nth-child(7n){border-right:0}
  .cell:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .cell.blank{background:var(--bg);cursor:default}
  .cell.blank:hover{background:var(--bg)}
  .cell .num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .cell.sat .num{color:#3b82f6}
  .cell.sun .num,.cell.holiday .num{color:#ef4444}
  .cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .hol{font-size:10px;color:#ef4444;font-weight:600;margin-top:-2px}
  .chip{font-size:11px;font-weight:600;padding:2px 5px;border-radius:5px;line-height:1.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more{font-size:10px;color:var(--muted);padding-left:3px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-left:2px}
  .legend span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:50%}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}

  /* ---- 용돈기입장 ---- */
  .kid-tabs{display:flex;gap:8px;margin-bottom:14px}
  .kid-tabs button{
    flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;
    font-size:15px;font-weight:700;padding:11px;border-radius:12px;cursor:pointer;transition:.15s;
  }
  .kid-tabs button.on{background:var(--c);border-color:var(--c);color:#fff}

  .balance{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;
  }
  .balance::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
  .balance small{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .balance .amt{font-size:36px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
  .balance .amt.minus{color:#ef4444}
  .balance .piggy{font-size:26px;margin-bottom:2px}

  .money-form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-top:14px;box-shadow:var(--shadow)}
  .kind-toggle{display:flex;gap:6px;margin-bottom:12px}
  .kind-toggle button{
    flex:1;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;
    font-size:14px;font-weight:700;padding:10px;border-radius:11px;cursor:pointer;transition:.15s;
  }
  .kind-toggle button.on#kindIn {background:#10b981;border-color:#10b981;color:#fff}
  .kind-toggle button.on#kindOut{background:#ef4444;border-color:#ef4444;color:#fff}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .form-grid input,.form-grid select{
    font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--text);min-width:0;
  }
  .form-grid input:focus,.form-grid select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .form-grid #mMemo{grid-column:1/-1}
  .form-grid #mAmount{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .form-grid button{grid-column:1/-1;padding:11px;font-size:14px}

  .month-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .sum-box{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:13px 15px;box-shadow:var(--shadow)}
  .sum-box small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .sum-box b{font-size:18px;font-variant-numeric:tabular-nums}
  .sum-box.in b{color:#10b981}
  .sum-box.out b{color:#ef4444}

  .ledger{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-top:14px;box-shadow:var(--shadow);overflow:hidden}
  .led-date{font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);
    padding:7px 15px;border-bottom:1px solid var(--line)}
  .led-row{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line)}
  .led-row:last-child{border-bottom:0}
  .led-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    font-size:15px;flex:none}
  .led-txt{min-width:0}
  .led-txt b{display:block;font-size:14px;font-weight:600;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .led-txt small{font-size:12px;color:var(--muted)}
  .led-amt{margin-left:auto;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
  .led-amt.in{color:#10b981}
  .led-amt.out{color:#ef4444}
  .led-del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;
    padding:2px 0 2px 4px;opacity:.45;flex:none}
  .led-del:hover{opacity:1;color:#ef4444}
  .led-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}

  dialog{border:0;border-radius:14px;padding:20px;background:var(--card);color:var(--text);
    box-shadow:var(--shadow);max-width:320px}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog p{margin:0 0 16px;font-size:14px;line-height:1.5}
  dialog .row{display:flex;gap:8px;justify-content:flex-end}

  /* ---- 지출 입력 방식 고르기 / 영수증 ---- */
  #spendDlg,#receiptDlg{max-width:380px;width:calc(100vw - 32px)}
  #spendDlg h3,#receiptDlg h3{margin:0;font-size:17px}
  .spend-choice{display:grid;gap:9px;margin:14px 0 4px}
  .choice{
    display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;
    gap:0 10px;align-items:center;text-align:left;
    border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;
    padding:12px;border-radius:14px;cursor:pointer;transition:.15s;
  }
  .choice:hover{border-color:var(--accent);background:var(--card)}
  .choice .em{grid-row:1/3;font-size:24px;line-height:1;text-align:center}
  .choice b{font-size:14.5px}
  .choice small{font-size:12px;color:var(--muted)}

  .receipt-body{margin:14px 0 4px}
  #receiptShot{display:block;width:100%;max-height:180px;object-fit:contain;
    border-radius:11px;background:var(--bg);margin-bottom:12px}
  #receiptShot:not([src]){display:none}
  .receipt-form{display:grid;gap:9px}
  .receipt-form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
  .receipt-form input,.receipt-form select{
    font:inherit;font-size:15px;padding:9px 10px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);
  }
  .receipt-form #rAmount{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
  .rcand{display:flex;gap:6px;flex-wrap:wrap;margin-top:-3px}
  .rcand:empty{display:none}
  .rcand button{
    border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;
    font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .rcand button:hover{border-color:var(--accent);color:var(--text)}
  .rcand button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .receipt-form input:focus,.receipt-form select:focus{
    outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  #confirmDlg{max-width:370px;width:calc(100vw - 32px)}
  #dayDlg{max-width:400px;width:calc(100vw - 32px)}
  #dayDlg h3{margin:0;font-size:18px}
  .dlg-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .sec-title{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 8px}
  .reg-row{display:flex;align-items:center;gap:9px;font-size:13px;padding:3px 0}
  .reg-row .nm{font-weight:700;color:var(--c);width:40px;flex:none}
  .reg-row .tm{color:var(--muted);font-variant-numeric:tabular-nums}
  .ev-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;
    font-size:13px;font-weight:600;margin-bottom:5px}
  .ev-item .memo{font-weight:400;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev-item .x{margin-left:auto;border:0;background:transparent;color:inherit;opacity:.55;
    cursor:pointer;font-size:15px;line-height:1;padding:0 2px;flex:none}
  .ev-item .x:hover{opacity:1}
  .add-form{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
  .add-form select,.add-form input[type=text]{
    font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);
    border-radius:9px;background:var(--bg);color:var(--text);min-width:0}
  .add-form input[type=text],.add-form button{grid-column:1/-1}

  @media (max-width:560px){
    /* 스크롤 없이 네 사람이 한 화면에 들어오도록 2×2 로 배치하고 전체를 압축한다 */
    /* 홈 화면 앱으로 열면 아래쪽 홈 바 영역까지 화면이 넓어진다.
       그만큼 여백을 두지 않으면 마지막 카드가 홈 바에 가려 스크롤이 생긴다. */
    .wrap{padding:12px 10px calc(14px + env(safe-area-inset-bottom));
      padding-left:calc(10px + env(safe-area-inset-left));
      padding-right:calc(10px + env(safe-area-inset-right))}
    header{margin-bottom:12px;gap:8px}
    h1{font-size:17px}
    .today-label{font-size:11px}
    .head-sub{gap:7px;margin-top:1px}
    .sync{font-size:10.5px}
    .tabs button{padding:7px 10px;font-size:12.5px}

    /* 공지는 잘 보이게 키우고, 대신 카드를 촘촘하게 */
    .notice{padding:10px 12px;margin-bottom:9px;gap:9px;align-items:center}
    .notice-title{font-size:15px;margin-bottom:4px}
    .notice-text{font-size:13.5px;line-height:1.45}
    .notice-tools{flex-direction:row;gap:4px}
    .notice-tools .btn{padding:4px 8px;font-size:11px}

    /* 화면 아래까지 카드가 채우도록 세로로 늘린다 */
    /* dvh 는 주소창이 접히고 펴질 때마다 값이 바뀌어 스크롤이 생긴다.
       svh(주소창이 보이는 상태의 높이)를 쓰면 어느 상태에서도 넘치지 않는다. */
    .wrap{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
    .panels{flex:1;min-height:0;display:flex;flex-direction:column}
    #panelToday.on{display:flex;flex-direction:column;flex:1;min-height:0}
    /* 단어 칸은 위에 고정 높이로 두고, 남는 세로 공간은 카드가 가져간다.
       카드 안에서는 배지 자리(시간과 하고싶은 말 사이)가 그 공간을 흡수한다. */
    #panelToday .words{flex:none}
    #panelToday .cards{flex:1;min-height:0;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}

    .cards{grid-template-columns:1fr 1fr;gap:8px}
    .card{padding:8px;display:flex;flex-direction:column}
    .card::before{width:3px}
    /* 이름·상태·기분을 한 줄에 모아 두 줄을 아낀다 */
    .card-head{gap:5px;margin-bottom:5px}
    .card h3{font-size:13.5px;gap:5px}
    .dot{width:7px;height:7px}
    .status{font-size:10px}
    .mood-pick{margin:0 0 5px}
    .mood-btn{padding:4px 8px;font-size:11px;gap:5px}
    .mood-btn .em{font-size:14px}

    /* 단어 칸은 카드 위에 낮게 한 줄로 */
    .words{gap:7px;margin:0 0 8px;--row-h:26px}
    .word-box{padding:5px 9px;border-radius:11px}
    .word-label{font-size:9.5px;margin-bottom:2px}
    .word-row{gap:6px}
    .word-row + .word-row{margin-top:3px}
    .word-row b{font-size:12.5px}
    .word-row small{font-size:10.5px}
    .hanja-char{font-size:20px;width:24px}
    .eng-w{font-size:14px}
    .eng-w.idiom{font-size:12px}
    .speak{font-size:13px}
    /* 시간 칸은 PC 처럼 낮게, 글자는 가운데로 */
    .times{gap:5px;flex:none}
    .time-box{padding:5px 4px;border-radius:9px;text-align:center}
    .time-box small{font-size:9.5px;margin-bottom:1px}
    .time-edit{font-size:18px;letter-spacing:-.7px;text-align:center}
    /* 배지 두 줄 자리 확보 — 남는 공간도 여기로 모인다 */
    .card-badges{margin-top:6px;padding-top:6px;gap:3px;min-height:34px}
    .card-badges .chip{font-size:9.5px;padding:1px 4px}
    .say{margin-top:6px;gap:4px;flex:none}
    .say-icon{font-size:10px;line-height:1.5}
    .say-input{font-size:11px;padding:4px 6px;border-radius:8px;line-height:1.35}
    th:first-child,td:first-child{width:46px;font-size:12px}
    input[type=time]{min-width:0;font-size:13px;padding:6px 2px}
    .acad-wrap{min-width:78px;gap:3px}
    .acad{font-size:10px;padding:4px 5px}
    .ox{font-size:12px;padding:6px 0;max-width:40px}
    th,td{padding:5px 2px}
    th{font-size:11px}
    .balance .amt{font-size:30px}
    .form-grid{grid-template-columns:1fr}
    .cell{min-height:66px;padding:3px}
    .cell .chip{font-size:10px;padding:1px 3px}
    .hol{display:none}
  }

  /* 세로가 짧은 휴대폰(주소창·툴바가 있는 브라우저) — 한 단계 더 줄인다.
     공지는 읽어야 하는 내용이라 최대한 건드리지 않는다. */
  @media (max-width:560px) and (max-height:730px){
    .wrap{padding:9px 9px calc(10px + env(safe-area-inset-bottom))}
    header{margin-bottom:8px;gap:6px}
    h1{font-size:16px}
    .today-label{font-size:10.5px}
    .tabs button{padding:6px 9px;font-size:12px}
    .notice{padding:6px 10px;margin-bottom:6px}
    .notice-title{font-size:14px;margin-bottom:3px}
    .notice-text{font-size:13px;line-height:1.4}

    .cards{gap:6px}
    .card{padding:6px}
    .card-head{margin-bottom:2px}
    .card h3{font-size:13px}
    .status{font-size:9.5px}
    .card-badges{min-height:20px;margin-top:4px;padding-top:4px}
    .words{margin-bottom:6px;gap:6px;--row-h:24px}
    .mood-pick{margin-bottom:4px}
    .mood-btn{padding:3px 7px;font-size:10.5px;gap:4px}
    .mood-btn .em{font-size:13px}
    .times{gap:4px}
    .time-box{padding:2px 3px}
    .time-box small{font-size:8.5px;margin-bottom:0}
    .time-edit{font-size:15px}
    .card-badges .chip{font-size:9px;padding:0 3px}
    .say{margin-top:4px}
    .say-input{font-size:9.5px;padding:2px 5px}
    .word-box{padding:4px 8px}
    .word-label{font-size:9px;margin-bottom:2px}
    .word-row + .word-row{margin-top:3px}
    .hanja-char{font-size:18px;width:22px}
    .word-row b{font-size:11.5px}
    .word-row small{font-size:10px}
    .eng-w{font-size:13px}
    .eng-w.idiom{font-size:11.5px}
    .speak{font-size:12px}
  }

  /* 아주 짧은 화면(주소창·툴바가 모두 보이는 소형 기기) — 마지막 단계로 더 줄인다 */
  @media (max-width:560px) and (max-height:580px){
    .wrap{padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
    .words{margin-bottom:5px;--row-h:22px}
    h1{font-size:15px}
    .notice{padding:6px 9px;margin-bottom:6px}
    .notice-title{font-size:13px;margin-bottom:2px}
    .notice-text{font-size:12.5px;line-height:1.32}
    .word-box{padding:4px 7px}
    .hanja-char{font-size:17px;width:20px}
    .word-label{font-size:8.5px;margin-bottom:1px}
    .word-row b{font-size:11px}
    .eng-w{font-size:12px}
    .eng-w.idiom{font-size:11px}
    .speak{font-size:11px}
    .card{padding:5px}
    .mood-btn{padding:2px 6px;font-size:10px}
    .time-box small{font-size:8px}
    .time-edit{font-size:14px}
    .card-badges{min-height:15px;margin-top:3px;padding-top:3px}
    .say{margin-top:3px}
    .say-input{font-size:9.5px;padding:2px 4px}
    .notice{padding:5px 9px;margin-bottom:5px}
  }
</style>
</head>
<body>
<div class="lock" id="lockScreen">
  <img class="lock-logo" src="./icon-192.png" alt="" onerror="this.remove()">
  <h2>준&amp;하진이네 가족어플</h2>
  <p class="lock-sub">비밀번호를 입력하세요</p>
  <input type="password" id="lockInput" inputmode="numeric" pattern="[0-9]*"
    maxlength="6" autocomplete="off" aria-label="비밀번호">
  <div class="lock-msg" id="lockMsg">이 기기에서는 처음 한 번만 입력하면 됩니다</div>
</div>

<div class="wrap">

  <header>
    <div>
      <h1>👨‍👩‍👦‍👦 준&amp;하진이네 가족어플</h1>
      <div class="head-sub">
        <span class="today-label" id="todayLabel"></span>
        <span class="sync" id="syncBadge" title="동기화 상태"></span>
      </div>
    </div>
    <nav class="tabs">
      <button id="tabToday" class="on" onclick="showTab('today')">오늘</button>
      <button id="tabMonth" onclick="showTab('month')">월간</button>
      <button id="tabMoney" onclick="showTab('money')">용돈</button>
      <button id="tabWeek" onclick="showTab('week')">주간 설정</button>
    </nav>
  </header>

  <div class="notice" id="notice"></div>

  <div class="panels" id="panels">

  <section id="panelToday" class="panel on">
    <div class="words" id="words"></div>
    <div class="cards" id="todayCards"></div>
  </section>

  <section id="panelMonth" class="panel">
    <div class="cal-head">
      <span class="cal-title" id="calTitle"></span>
      <div class="cal-nav">
        <button class="btn" onclick="moveMonth(0)">오늘</button>
        <button class="btn" onclick="moveMonth(-1)">◀</button>
        <button class="btn" onclick="moveMonth(1)">▶</button>
      </div>
    </div>
    <div class="cal">
      <div class="cal-grid">
        <div class="dow sun">일</div><div class="dow">월</div><div class="dow">화</div>
        <div class="dow">수</div><div class="dow">목</div><div class="dow">금</div><div class="dow sat">토</div>
      </div>
      <div class="cal-grid" id="calBody"></div>
    </div>
    <div class="legend" id="calLegend"></div>
    <div class="hint">날짜를 누르면 그날의 정규 시간표를 확인하고 휴가·재택 같은 특별 일정을 추가할 수 있어요.</div>
  </section>

  <section id="panelMoney" class="panel">
    <div class="kid-tabs" id="kidTabs"></div>

    <div class="balance" id="balanceCard"></div>

    <div class="money-form">
      <div class="kind-toggle">
        <button type="button" class="on" id="kindIn"  onclick="setKind('in')">➕ 받았어요</button>
        <button type="button" class="" id="kindOut" onclick="openSpendChoice()">➖ 썼어요</button>
      </div>
      <input type="file" id="receiptFile" accept="image/*" capture="environment" hidden
        onchange="readReceipt(this)">
      <div class="form-grid">
        <input type="date" id="mDate">
        <select id="mCat"></select>
        <input type="text" id="mMemo" maxlength="20" placeholder="내용 (예: 학교 앞 문구점)">
        <input type="number" id="mAmount" min="0" step="100" inputmode="numeric" placeholder="금액 (원)">
        <button class="btn primary" id="mAddBtn">기록하기</button>
      </div>
    </div>

    <div class="month-sum" id="monthSum"></div>
    <div class="ledger" id="ledger"></div>
  </section>

  <section id="panelWeek" class="panel">
    <div id="weekEditor"></div>
    <div class="footer-bar">
      <span class="saved" id="savedMsg">변경하면 자동으로 저장됩니다</span>
      <button class="btn" onclick="exportJson()">백업 파일 저장</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">백업 불러오기</button>
      <button class="btn" onclick="askReset()">전체 초기화</button>
      <input type="file" id="importFile" accept="application/json" hidden onchange="importJson(this)">
    </div>
  </section>

  </div>
</div>

<dialog id="spendDlg">
  <h3>어떻게 기록할까요?</h3>
  <div class="dlg-sub" id="spendWho"></div>
  <div class="spend-choice">
    <button type="button" class="choice" onclick="chooseManual()">
      <span class="em">✏️</span>
      <b>직접 입력하기</b>
      <small>금액을 손으로 적어요</small>
    </button>
    <button type="button" class="choice" onclick="chooseReceipt()">
      <span class="em">📷</span>
      <b>영수증 찍기</b>
      <small>사진에서 금액을 읽어와요</small>
    </button>
  </div>
  <div class="row">
    <button class="btn" onclick="document.getElementById('spendDlg').close()">취소</button>
  </div>
</dialog>

<dialog id="receiptDlg">
  <h3>영수증 확인</h3>
  <div class="dlg-sub" id="receiptState">사진을 읽는 중이에요…</div>
  <div class="receipt-body">
    <img id="receiptShot" alt="">
    <div class="receipt-form" id="receiptForm" hidden>
      <label>금액
        <input type="number" id="rAmount" min="0" step="10" inputmode="numeric">
      </label>
      <div class="rcand" id="rCand"></div>
      <label>분류
        <select id="rCat"></select>
      </label>
      <label>내용
        <input type="text" id="rMemo" maxlength="20" placeholder="예: 편의점">
      </label>
      <label>날짜
        <input type="date" id="rDate">
      </label>
    </div>
  </div>
  <div class="row">
    <button class="btn primary" id="rSave" onclick="saveReceipt()" hidden>기록하기</button>
    <button class="btn" onclick="closeReceipt()">닫기</button>
  </div>
</dialog>

<dialog id="moodDlg">
  <h3 id="moodDlgTitle"></h3>
  <div class="dlg-sub">오늘 기분을 골라주세요</div>
  <div class="mood-grid" id="moodDlgList"></div>
  <div class="row">
    <button class="btn" id="moodClear" onclick="clearMood()">선택 지우기</button>
    <button class="btn" onclick="document.getElementById('moodDlg').close()">닫기</button>
  </div>
</dialog>

<dialog id="dayDlg">
  <h3 id="dayTitle"></h3>
  <div class="dlg-sub" id="dayHoliday"></div>

  <div class="sec-title">정규 시간표</div>
  <div id="dayRegular"></div>

  <div class="sec-title">특별 일정</div>
  <div id="dayEvents"></div>
  <div class="add-form">

/* 저장된 주간 데이터를 안전하게 병합 (예전 버전 데이터도 그대로 살림) */
function mergeWeekly(raw){
  const base = blankData();
  for (const m of MEMBERS)
    for (const day of DAYS){
      const v = raw?.[m.key]?.[day.key];
      if (v && typeof v === 'object'){
        /* academy(단일 문자열) → academies(배열) 자동 변환 */
        const picked = Array.isArray(v.academies) ? v.academies : (v.academy ? [v.academy] : []);
        const slot = {
          go:   v.go   || '',
          back: v.back || '',
          academies: acadList(m.key).filter(a => picked.includes(a)),
        };
        for (const f of PARENT_FLAGS) slot[f.key] = m.role === 'parent' && !!v[f.key];
        base[m.key][day.key] = slot;
      }
    }
  return base;
}

/* events = { "2026-07-15": [ {id, member, type, memo} ] } */
function cleanEvents(raw){
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [date, list] of Object.entries(raw)){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Array.isArray(list)) continue;
    const items = list
      .filter(e => e && memberOf(e.member))
      .map(e => ({
        id: String(e.id ?? Math.random().toString(36).slice(2)),
        member: e.member,
        type: typeOf(e.type).key,
        memo: String(e.memo || '').slice(0, 30),
      }));
    if (items.length) out[date] = items;
  }
  return out;
}
function loadEvents(){
  try{ return cleanEvents(JSON.parse(localStorage.getItem(EVENTS_KEY))); }
  catch(e){ return {}; }
}
function saveEvents(){ put(EVENTS_KEY, events); pushRemote(); }

/* money = { jun:[{id,date,kind,cat,memo,amount}], hajin:[...] } */
function cleanMoney(raw){
  const out = {};
  for (const kid of KIDS){
    const list = Array.isArray(raw?.[kid.key]) ? raw[kid.key] : [];
    out[kid.key] = list
      .filter(e => e && (e.kind === 'in' || e.kind === 'out')
                && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && Number.isFinite(Number(e.amount)))
      .map(e => ({
        id: String(e.id ?? Math.random().toString(36).slice(2)),
        date: e.date,
        kind: e.kind,
        cat: catOf(e.kind, e.cat).k,
        memo: String(e.memo || '').slice(0, 20),
        amount: Math.max(0, Math.round(Number(e.amount))),
        ...(e.src === 'receipt' ? { src: 'receipt' } : {}),
      }));
  }
  return out;
}
function loadMoney(){
  try{ return cleanMoney(JSON.parse(localStorage.getItem(MONEY_KEY))); }
  catch(e){ return cleanMoney(null); }
}
function saveMoney(){ put(MONEY_KEY, money); pushRemote(); }

/* moods = { "2026-07-28": { dad:'good', jun:'tired' } } — 날짜별로 남아 매일 새로 시작한다 */
function cleanMoods(raw){
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [date, byMember] of Object.entries(raw)){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !byMember || typeof byMember !== 'object') continue;
    const day = {};
    for (const m of MEMBERS)
      if (moodOf(byMember[m.key])) day[m.key] = byMember[m.key];
    if (Object.keys(day).length) out[date] = day;
  }
  return out;
}

/* says = { "2026-07-28": { dad: "오늘 하고싶은 말" } } — 기분과 같이 날짜별로 남는다 */
function cleanSays(raw){
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [date, byMember] of Object.entries(raw)){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !byMember || typeof byMember !== 'object') continue;
    const day = {};
    for (const m of MEMBERS){
      const t = String(byMember[m.key] ?? '').trim().slice(0, 60);
      if (t) day[m.key] = t;
    }
    if (Object.keys(day).length) out[date] = day;
  }
  return out;
}
function loadSays(){
  try{ return cleanSays(JSON.parse(localStorage.getItem(SAYS_KEY))); }
  catch(e){ return {}; }
}
function saveSays(){ put(SAYS_KEY, says); pushRemote(); }

/* ---------- 유틸 ---------- */
const todayIdx = () => (new Date().getDay() + 6) % 7;   // 0=월 … 6=일
const nowMin   = () => { const n=new Date(); return n.getHours()*60 + n.getMinutes(); };
const toMin    = t => { if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
const pad2     = n => String(n).padStart(2,'0');
const ymd      = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;
const ymdOf    = dt => ymd(dt.getFullYear(), dt.getMonth(), dt.getDate());
const esc      = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- 오늘 화면 ---------- */

/* "0730" "7:30" "730" 처럼 편하게 쳐도 07:30 으로 맞춰준다.
   빈 값이면 '' (시간 없음), 말이 안 되는 값이면 null 을 돌려준다. */
function parseTime(raw){
  const s = String(raw).trim();
  if (!s) return '';
  let h, m;
  /* 구분자를 직접 쓴 경우('7:5', '7.5', '7 5')는 그 구분을 그대로 따른다 */
  const split = s.match(/^(\d{1,2})\s*[:.\s]\s*(\d{1,2})$/);
  if (split){
    h = +split[1]; m = +split[2];
  } else {
    const d = s.replace(/[^0-9]/g, '');
    if (!d) return null;     // 글자만 친 경우 — 실수로 시간이 지워지지 않게 거부
    if (d.length <= 2)       { h = +d;             m = 0; }
    else if (d.length === 3) { h = +d.slice(0, 1); m = +d.slice(1); }
    else if (d.length === 4) { h = +d.slice(0, 2); m = +d.slice(2); }
    else return null;
  }
  if (h > 23 || m > 59) return null;
  return `${pad2(h)}:${pad2(m)}`;
}

function statusOf(m, s, now){
  const go = toMin(s.go), back = toMin(s.back);
  if (go === null && back === null)     return '🏠 일정 없음';
  if (go !== null && now < go)          return `⏰ ${m.goLabel} 전`;
  if (back !== null && now < back)      return '🚶 외출 중';
  if (back !== null)                    return `🏠 ${m.backLabel} 완료`;
  return '🚶 외출 중';
}

/* 시간을 고쳤을 때 상태 문구만 바꾼다 — 화면 전체를 다시 그리면
   이어서 누른 버튼의 클릭이 사라지기 때문 */
function refreshStatuses(){
  const day = DAYS[todayIdx()], now = nowMin();
  document.querySelectorAll('#todayCards .card').forEach((card, i) => {
    const el = card.querySelector('.status');
    if (el && MEMBERS[i]) el.textContent = statusOf(MEMBERS[i], data[MEMBERS[i].key][day.key], now);
  });
}

/* 오늘 화면에서 고친 시간은 그 요일의 주간 설정에 그대로 반영된다 */
function setTodayTime(mKey, field, raw, el){
  const dayKey = DAYS[todayIdx()].key;
  const v = parseTime(raw);
  if (v === null){                       // 잘못 친 값은 원래대로 되돌린다
    el.value = data[mKey][dayKey][field] || '';
    el.classList.add('bad');
    setTimeout(() => el.classList.remove('bad'), 900);
    return;
  }
  data[mKey][dayKey][field] = v;
  el.value = v;
  save();            // 저장 + 다른 기기로 전송
  renderWeek();      // 주간 설정 표에 반영
  refreshStatuses();
}

function renderToday(){
  /* 입력하는 중이면 다시 그리지 않는다 (입력 내용이 지워지는 것을 막음) */

  const cards = MEMBERS.map(m => {
    const s = data[m.key][day.key];

    const badges = [
      ...PARENT_FLAGS.filter(f => s[f.key]).map(f =>
        `<span class="chip" style="background:${f.bg};color:${f.fg}">${f.icon} ${f.badge}</span>`),

    const status = statusOf(m, s, now);

    /* 기분은 버튼을 눌러 팝업에서 고른다 */
    const mood = moodOf(todayMoods[m.key]);

    return `

          </label>
          <label class="time-box">
            <small>${m.backLabel}</small>

              value="${s.back}" placeholder="--:--" aria-label="${m.name} ${m.backLabel} 시간"

  document.getElementById('todayCards').innerHTML = cards;

/* 날짜를 기준으로 고르므로 온 가족이 같은 단어를 보고, 매일 바뀐다.
   count 개를 뽑을 때는 서로 겹치지 않게 이어서 가져온다. */
function wordsOfDay(list, dateKey, count){
  const days = Math.floor(Date.parse(dateKey + 'T00:00:00Z') / 86400000);
  const out = [];
  for (let i = 0; i < count; i++){
    const n = list.length;
    out.push(list[(((days * count + i) % n) + n) % n]);
  }
  return out;
}

function renderWords(dateKey){
  const hs = wordsOfDay(HANJA, dateKey, 2);
  const [e]  = wordsOfDay(ENGLISH, dateKey, 1);
  const [id] = wordsOfDay(IDIOMS,  dateKey, 1);
  const engRow = (o, cls) => `
    <div class="word-row">
      <b class="${cls}">${o.w}</b>
      <small>${o.m}</small>
      <button type="button" class="speak" title="발음 듣기"
        onclick="speak('${o.w}', this)">🔊</button>
    </div>`;

  document.getElementById('words').innerHTML = `
    <div class="word-box">
      <span class="word-label">오늘의 한자 · 7급</span>
      ${hs.map(h => `
        <div class="word-row">
          <span class="hanja-char">${h.c}</span>
          <b>${h.m} ${h.s}</b>
          <small>${h.w} · ${h.wm}</small>
        </div>`).join('')}
    </div>
    <div class="word-box">
      <span class="word-label">오늘의 영어 · 중1</span>
      ${engRow(e, 'eng-w')}
      ${engRow(id, 'eng-w idiom')}
    </div>`;
}

/* 발음 듣기 — 기기에 내장된 목소리를 쓴다 */
function speak(word, btn){
  if (!('speechSynthesis' in window)){
    alert('이 브라우저에서는 발음 듣기를 지원하지 않아요.');
    return;
  }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.85;
    if (btn){
      btn.classList.add('on');
      const off = () => btn.classList.remove('on');
      u.onend = off; u.onerror = off;
      setTimeout(off, 4000);          // 목소리가 없어 조용히 끝나는 경우 대비
    }
    speechSynthesis.speak(u);
  }catch(err){
    alert('발음을 재생할 수 없습니다.');
  }
}

/* 저장만 하고 화면은 다시 그리지 않는다 — 입력칸이 이미 그 값을 보여주고 있고,
   다시 그리면 바로 이어서 누른 버튼의 클릭이 사라지기 때문 */
function setSay(mKey, value){
  const key = ymdOf(new Date());
  const text = String(value).trim().slice(0, 60);
  const day = says[key] || (says[key] = {});
  if (text) day[mKey] = text; else delete day[mKey];
  if (!Object.keys(day).length) delete says[key];
  saveSays();
}

function pickMood(moodKey){

/* 같은 기분을 다시 누르면 선택 해제된다 */
function setMood(mKey, moodKey){
  const key = ymdOf(new Date());
  const day = moods[key] || (moods[key] = {});
  if (day[mKey] === moodKey) delete day[mKey];
  else day[mKey] = moodKey;
  if (!Object.keys(day).length) delete moods[key];
  saveMoods();
  renderToday();
}

/* ---------- 월간 달력 ---------- */
let view = new Date();
view.setDate(1);

function moveMonth(step){
  if (step === 0) { view = new Date(); view.setDate(1); }
  else view = new Date(view.getFullYear(), view.getMonth() + step, 1);
  renderMonth();
}

function renderMonth(){
  const y = view.getFullYear(), mo = view.getMonth();
  document.getElementById('calTitle').textContent = `${y}년 ${mo + 1}월`;

  const firstDow = new Date(y, mo, 1).getDay();     // 0=일
  const lastDate = new Date(y, mo + 1, 0).getDate();
  const todayKey = ymdOf(new Date());
  let html = '';

  for (let i = 0; i < firstDow; i++) html += `<div class="cell blank"></div>`;

  for (let d = 1; d <= lastDate; d++){
    const key = ymd(y, mo, d);
    const dow = new Date(y, mo, d).getDay();
    const hol = HOLIDAYS[key.slice(5)];
    const list = events[key] || [];
    const shown = list.slice(0, 3);

    const cls = ['cell'];
    if (dow === 0) cls.push('sun');
    if (dow === 6) cls.push('sat');
    if (hol) cls.push('holiday');
    if (key === todayKey) cls.push('today');

    const chips = shown.map(e => {
      const t = typeOf(e.type), m = memberOf(e.member);
      const label = `${m.name} ${t.name}${e.memo ? ' · ' + e.memo : ''}`;
      return `<span class="chip" style="background:${t.bg};color:${t.fg}" title="${esc(label)}"
        >${m.name} ${t.name}</span>`;
    }).join('');

    html += `<div class="${cls.join(' ')}" onclick="openDay('${key}')">
        <span class="num">${d}</span>
        ${hol ? `<span class="hol">${hol}</span>` : ''}
        ${chips}
        ${list.length > 3 ? `<span class="more">+${list.length - 3}건</span>` : ''}
      </div>`;
  }

  const trailing = (7 - ((firstDow + lastDate) % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += `<div class="cell blank"></div>`;

  document.getElementById('calBody').innerHTML = html;
  document.getElementById('calLegend').innerHTML = EVENT_TYPES
    .map(t => `<span><i style="background:${t.dot}"></i>${t.name}</span>`).join('');
}

function renderDayEvents(){
  const list = events[openedDate] || [];

/* 영수증에서 결제 금액을 골라낸다.
   승인번호·사업자번호·전화번호처럼 금액이 아닌 숫자가 많아, 큰 값을 고르는
   방식으로는 자주 틀린다. 줄과 숫자의 생김새에 점수를 매겨 판단한다. */
const AMOUNT_KEYS = /(합\s*계|총\s*액|총\s*합|결\s*제\s*금\s*액|승\s*인\s*금\s*액|청\s*구\s*금\s*액|총\s*구\s*매|받\s*을\s*금\s*액|total|amount)/i;
/* 합계를 이루는 조각들 — 이걸 결제 금액으로 착각하면 안 된다.
   예: 합계 6,500 = 판매금액(공급가액) 5,910 + 부가세 590 */
const PART_KEYS = /(판\s*매\s*금\s*액|공\s*급\s*가\s*액|과\s*세\s*물\s*품|면\s*세\s*물\s*품|부\s*가\s*세|봉\s*사\s*료|단\s*가)/i;
/* 금액이 아니라 번호가 적히는 줄 */
const NOISE_KEYS = /(승\s*인|가\s*맹|사\s*업\s*자|등\s*록|전\s*화|tel|카\s*드\s*번\s*호|일\s*련|거\s*래\s*번\s*호|단\s*말|pos|주\s*소|대\s*표|바\s*코\s*드|유\s*효|할\s*부|회\s*원|번\s*호|no\.)/i;
/* 결제 금액과 헷갈리기 쉬운 다른 금액이 적히는 줄 */
const OTHER_KEYS = /(거\s*스\s*름|잔\s*돈|받\s*은|현\s*금|신\s*용|체\s*크|봉\s*사\s*료|부\s*가|과\s*세|면\s*세|할\s*인|쿠\s*폰|적\s*립|포\s*인\s*트|잔\s*액)/i;

function candidatesIn(line){
  const out = [];
  const re = /(\d{1,3}(?:,\d{3})+|\d{2,10})(\s*원)?/g;
  let m;
  while ((m = re.exec(line)) !== null){
    const raw = m[1];
    const digits = raw.replace(/\D/g, '');
    const before = line[m.index - 1] || '';
    const after  = line[m.index + m[0].length] || '';
    out.push({
      value: Number(digits),
      len: digits.length,
      comma: raw.includes(','),
      won: !!m[2],
      /* 앞뒤에 숫자나 하이픈이 붙어 있으면 더 긴 번호의 일부다 (123-45-67890) */
      glued: /[\d\-*/]/.test(before) || /[\d\-*/]/.test(after),
    });
  }
  return out;
}

/* 그럴듯한 순서로 후보를 돌려준다 */
function amountCandidates(text){
  const lines = String(text).split(/\r?\n/);
  const found = [];

  lines.forEach((line, i) => {
    const prev = lines[i - 1] || '';
    /* '합계' 만 찍히고 숫자는 다음 줄에 오는 영수증이 많다 */
    const carried = AMOUNT_KEYS.test(prev) && candidatesIn(prev).length === 0;

    for (const c of candidatesIn(line)){
      if (c.value < 100 || c.value > 2000000) continue;
      let s = 0;
      if (AMOUNT_KEYS.test(line)) s += 60;
      if (carried)               s += 45;
      if (NOISE_KEYS.test(line)) s -= 80;
      if (PART_KEYS.test(line))  s -= 50;
      if (OTHER_KEYS.test(line)) s -= 55;
      if (c.comma)               s += 25;
      if (c.won)                 s += 20;
      if (c.glued)               s -= 60;
      if (c.len >= 8)            s -= 70;
      else if (c.len === 7)      s -= 20;
      if (c.value % 10 === 0)    s += 8;
      if (c.value > 300000)      s -= 15;
      /* 번호로 보이는 숫자는 후보에서 아예 뺀다.
         읽지 못했다고 알리는 편이, 엉뚱한 값을 채워 넣는 것보다 낫다. */
      if (s <= -40) continue;
      found.push({ value: c.value, score: s });
    }
  });

  /* 같은 금액은 가장 높은 점수만 남기되, 여러 번 찍혔다면 가점한다.
     결제 금액은 품목·합계·카드전표에 반복해서 찍히는 경우가 많다. */
  const best = new Map();
  const seen = new Map();
  for (const f of found){
    seen.set(f.value, (seen.get(f.value) || 0) + 1);
    if (!best.has(f.value) || best.get(f.value) < f.score) best.set(f.value, f.score);
  }
  return [...best.entries()]
    .map(([value, score]) => ({ value, score: score + Math.min(18, (seen.get(value) - 1) * 9) }))
    .sort((a, b) => (b.score - a.score) || (b.value - a.value));
}

function pickAmount(text){
  const list = amountCandidates(text);
  return list.length ? list[0].value : null;
}

/* 사진을 연다. 휴대폰이 남긴 방향 정보가 있으면 그대로 반영한다. */
async function loadPhoto(file){
  if ('createImageBitmap' in window){
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { /* 지원하지 않으면 아래로 */ }
  }
  return await new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 열 수 없습니다')); };
    img.src = url;
  });
}

/* 원하는 각도로 돌리면서 가로 maxW 이하로 줄인다 */
function rotateTo(src, deg, maxW){
  const sw = src.width, sh = src.height;
  const swap = deg === 90 || deg === 270;
  const scale = Math.min(1, maxW / (swap ? sh : sw));
  const cv = document.createElement('canvas');
  cv.width  = Math.round((swap ? sh : sw) * scale);
  cv.height = Math.round((swap ? sw : sh) * scale);
  const ctx = cv.getContext('2d');
  ctx.translate(cv.width / 2, cv.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(src, -sw * scale / 2, -sh * scale / 2, sw * scale, sh * scale);
  return cv;
}

/* 읽은 글자가 영수증답게 나왔는지 점수로 본다.
   사진이 돌아가 있으면 글자가 엉망으로 나오므로 이 점수가 낮다. */
function readQuality(text, cands){
  let q = 0;
  if (/합\s*계|금\s*액|승\s*인|영\s*수\s*증|카\s*드/.test(text)) q += 50;
  q += Math.min(30, (String(text).match(/\d{1,3},\d{3}/g) || []).length * 10);
  if (cands.length && cands[0].score >= 70) q += 40;
  return q;
}

let receiptWorker = null;

async function readReceipt(input){
  const file = input.files[0];
  input.value = '';
  if (!file) return;

  const dlg = document.getElementById('receiptDlg');
  const state = document.getElementById('receiptState');
  const form = document.getElementById('receiptForm');
  const saveBtn = document.getElementById('rSave');
  form.hidden = true; saveBtn.hidden = true;
  state.textContent = '사진을 준비하는 중이에요…';
  dlg.showModal();

  let amount = null;
  try{
    const photo = await loadPhoto(file);
    document.getElementById('receiptShot').src = rotateTo(photo, 0, 700).toDataURL('image/jpeg', 0.6);

    state.textContent = '글자를 읽는 중이에요… (처음엔 조금 걸려요)';
    const { createWorker } = await import('https://cdn.jsdelivr.net/npm/tesseract.js@5/+esm');
    if (!receiptWorker) receiptWorker = await createWorker(['kor', 'eng']);

    /* 영수증 사진은 옆으로 눕혀 찍는 경우가 많다. 돌려가며 읽어보고
       가장 잘 읽힌 방향을 쓴다. 잘 읽히면 그 자리에서 멈춘다. */
    let best = { quality: -1, list: [], deg: 0 };
    for (const deg of [0, 90, 270, 180]){
      if (deg) state.textContent = `사진을 ${deg}° 돌려 다시 읽는 중이에요…`;
      const cv = rotateTo(photo, deg, 1400);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
      const { data } = await receiptWorker.recognize(blob);
      const list = amountCandidates(data.text);
      const quality = readQuality(data.text, list);
      if (quality > best.quality){
        best = { quality, list, deg };
        document.getElementById('receiptShot').src = cv.toDataURL('image/jpeg', 0.5);
      }
      if (quality >= 90) break;
    }

    const list = best.list.slice(0, 4);
    amount = list.length ? list[0].value : null;
    showCandidates(list);
    state.textContent = amount
      ? (list.length > 1
          ? '금액이 다르면 아래에서 골라주세요'
          : '읽은 금액이 맞는지 확인해주세요')
      : '금액을 읽지 못했어요. 직접 적어주세요';
  }catch(err){
    showCandidates([]);
    state.textContent = '사진에서 글자를 읽지 못했어요. 금액을 직접 적어주세요';
  }

  document.getElementById('rAmount').value = amount ?? '';
  document.getElementById('rCat').innerHTML =
    CATS.out.map(c => `<option value="${c.k}">${c.e} ${c.n}</option>`).join('');
  document.getElementById('rMemo').value = '';
  document.getElementById('rDate').value = ymdOf(new Date());
  form.hidden = false;
  saveBtn.hidden = false;
  if (amount === null) document.getElementById('rAmount').focus();
}

/* 잘못 고른 경우를 대비해 다른 후보도 눌러서 바꿀 수 있게 한다 */
function showCandidates(list){
  const box = document.getElementById('rCand');
  box.innerHTML = (list.length > 1)
    ? list.map((c, i) =>
        `<button type="button" class="${i === 0 ? 'on' : ''}"
           onclick="useCandidate(${c.value}, this)">${won(c.value)}</button>`).join('')
    : '';
}
function useCandidate(value, btn){
  document.getElementById('rAmount').value = value;
  for (const b of document.querySelectorAll('#rCand button')) b.classList.remove('on');
  btn.classList.add('on');
}

function balanceOf(kidKey){
  return money[kidKey].reduce((sum, e) => sum + (e.kind === 'in' ? e.amount : -e.amount), 0);
}

function renderMoney(){
  const kid = KIDS.find(k => k.key === curKid);
  const list = [...money[curKid]].sort((a, b) =>
    a.date === b.date ? b.id.localeCompare(a.id) : b.date.localeCompare(a.date));

  document.getElementById('kidTabs').innerHTML = KIDS.map(k =>
    `<button class="${k.key === curKid ? 'on' : ''}" style="--c:${k.color}"
       onclick="setKid('${k.key}')">${k.emoji} ${k.name}</button>`).join('');

  const bal = balanceOf(curKid);
  document.getElementById('balanceCard').style.setProperty('--c', kid.color);
  document.getElementById('balanceCard').innerHTML = `
    <div class="piggy">🐷</div>
    <small>${kid.name}이의 남은 용돈</small>
    <div class="amt ${bal < 0 ? 'minus' : ''}">${won(bal)}</div>`;

  /* 이번 달 요약 */
  const now = new Date();
  const prefix = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
  const mIn  = list.filter(e => e.date.startsWith(prefix) && e.kind === 'in')
                   .reduce((s, e) => s + e.amount, 0);
  const mOut = list.filter(e => e.date.startsWith(prefix) && e.kind === 'out')
                   .reduce((s, e) => s + e.amount, 0);
  document.getElementById('monthSum').innerHTML = `
    <div class="sum-box in"><small>${now.getMonth() + 1}월에 받은 돈</small><b>+${won(mIn)}</b></div>
    <div class="sum-box out"><small>${now.getMonth() + 1}월에 쓴 돈</small><b>−${won(mOut)}</b></div>`;

  /* 내역 (날짜별 묶음) */
  if (!list.length){
    document.getElementById('ledger').innerHTML =
      `<div class="led-empty">아직 기록이 없어요 🐷<br>위에서 받은 돈이나 쓴 돈을 적어보세요!</div>`;
    return;
  }
  let html = '', lastDate = '';
  for (const e of list){
    if (e.date !== lastDate){
      lastDate = e.date;
      const [y, m, d] = e.date.split('-').map(Number);
      const dw = DAYS[(new Date(y, m - 1, d).getDay() + 6) % 7].short;
      html += `<div class="led-date">${m}월 ${d}일 (${dw})</div>`;
    }
    const c = catOf(e.kind, e.cat);
    const tint = e.kind === 'in' ? '#d1fae5' : '#fee2e2';
    html += `
      <div class="led-row">
        <span class="led-icon" style="background:${tint}">${c.e}</span>
        <span class="led-txt">
          <b>${e.memo ? esc(e.memo) : c.n}</b>
          <small>${c.n}${e.src === 'receipt' ? ' · 🧾 영수증' : ''}</small>
        </span>
        <span class="led-amt ${e.kind}">${e.kind === 'in' ? '+' : '−'}${won(e.amount)}</span>
        <button class="led-del" title="삭제" onclick="delMoney('${e.id}')">✕</button>
      </div>`;
  }
  document.getElementById('ledger').innerHTML = html;
}

function setTime(mKey, dKey, field, value){
  data[mKey][dKey][field] = value;
  save();
  renderToday();
}
function toggleFlag(mKey, dKey, field){
  data[mKey][dKey][field] = !data[mKey][dKey][field];
  save(); renderWeek(); renderToday();
}
function toggleAcademy(mKey, dKey, name){
  const slot = data[mKey][dKey];
  const set = new Set(slot.academies);
  if (set.has(name)) set.delete(name); else set.add(name);
  slot.academies = acadList(mKey).filter(a => set.has(a));   // 항상 같은 순서로 정렬
  save(); renderWeek(); renderToday();
}
function fillWeekdays(mKey){
  const src = data[mKey].mon;
  for (const d of WEEKDAYS) data[mKey][d] = copySlot(src);
  save(); renderWeek(); renderToday();
}
function clearMember(mKey){
  for (const d of DAYS) data[mKey][d.key] = blankSlot();
  save(); renderWeek(); renderToday();
}

function exportJson(){
  const payload = { version:6, weekly:data, events, money, moods, says, notice };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `가족스케줄_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
/* 백업 파일에 무엇이 들어 있는지 한 줄로 요약 — 파일을 잘못 고르지 않도록 */
function summarize(parsed){
  const w = mergeWeekly(parsed?.weekly || parsed);
  const times = MEMBERS.reduce((n, m) =>
    n + DAYS.filter(d => w[m.key][d.key].go || w[m.key][d.key].back).length, 0);
  const ev = Object.values(cleanEvents(parsed?.events)).reduce((n, l) => n + l.length, 0);
  const mn = Object.values(cleanMoney(parsed?.money)).reduce((n, l) => n + l.length, 0);
  return `시간표 ${times}칸 · 특별 일정 ${ev}건 · 용돈 기록 ${mn}건`;
}

function importJson(input){
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      askImport(parsed, file.name);
    }catch(e){
      alert('파일을 읽을 수 없습니다. 백업 파일이 맞는지 확인해 주세요.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ---------- 탭 ---------- */
const TAB_ORDER = ['today', 'month', 'money', 'week'];
let curTab = 'today';

/* 좌우로 밀어 탭을 넘긴다. 사진첩을 넘기는 것과 같은 방향이다.
   손가락을 왼쪽으로 끌면 오른쪽 탭(다음)이 오고,
   오른쪽으로 끌면 왼쪽 탭(이전)이 온다. 양 끝은 서로 이어져 있다.
     주간 설정에서 손가락을 왼쪽으로 끌면 오늘
     오늘에서 손가락을 오른쪽으로 끌면 주간 설정 */
(function setupSwipe(){
  let x0 = 0, y0 = 0, live = false, swiped = false;
  let scroller = null, scrollAt = 0;

  document.addEventListener('touchstart', e => {
    live = false;
    scroller = null;
    if (e.touches.length !== 1) return;
    if (document.documentElement.classList.contains('locked')) return;
    if (e.target.closest && e.target.closest('dialog')) return;
    /* 지금 편집 중인 칸 위에서 끄는 것은 글자 선택이므로 건드리지 않는다 */
    const a = document.activeElement;
    if (a === e.target && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;

    /* 주간 설정 표는 화면 전체를 덮고 있어 통째로 제외하면 스와이프가 아예 안 된다.
       실제로 표가 좌우로 움직였는지 나중에 확인해서 판단한다. */
    const sc = e.target.closest && e.target.closest('.table-scroll');
    if (sc && sc.scrollWidth > sc.clientWidth + 1){
      scroller = sc;
      scrollAt = sc.scrollLeft;
    }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    live = true;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!live) return;
    live = false;
    if (scroller && scroller.scrollLeft !== scrollAt) return;  // 표를 좌우로 본 것
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) < 55) return;                 // 너무 짧으면 무시
    if (Math.abs(dx) < Math.abs(dy) * 1.3) return; // 세로로 움직였으면 무시
    const i = TAB_ORDER.indexOf(curTab);
    const step = dx < 0 ? 1 : -1;      // 왼쪽으로 끌면 다음 탭
    showTab(TAB_ORDER[(i + step + TAB_ORDER.length) % TAB_ORDER.length], step);
    swiped = true;
    setTimeout(() => { swiped = false; }, 300);
  }, { passive: true });

  /* 민 자리에 있던 버튼이나 입력칸이 따라 눌리지 않게 막는다 */
  document.addEventListener('click', e => {
    if (!swiped) return;
    swiped = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
})();

const panelId = t => 'panel' + t[0].toUpperCase() + t.slice(1);
let leaveTimer = null;

/* dir 을 주면 그 방향으로 넘어간다. 안 주면 탭 순서로 알아서 정한다.
   나가는 화면은 한쪽으로 밀려나가고 새 화면이 반대쪽에서 들어온다. */
function showTab(which, dir){
  if (dir === undefined){
    const from = TAB_ORDER.indexOf(curTab), to = TAB_ORDER.indexOf(which);
    dir = to >= from ? 1 : -1;
  }
  const panel = document.getElementById(panelId(which));
  const prev = document.getElementById(panelId(curTab));

  /* 빠르게 여러 번 넘길 때 이전 잔상이 남지 않게 먼저 정리한다 */
  clearTimeout(leaveTimer);
  for (const p of document.querySelectorAll('.panel.leaving')){
    p.classList.remove('leaving');
    p.style.removeProperty('--slide');
  }

  if (prev && prev !== panel){
    prev.style.setProperty('--slide', (dir > 0 ? -100 : 100) + '%');
    prev.classList.add('leaving');
    leaveTimer = setTimeout(() => {
      prev.classList.remove('leaving');
      prev.style.removeProperty('--slide');
    }, 280);
  }
  panel.style.setProperty('--slide', (dir > 0 ? 100 : -100) + '%');

  curTab = which;
  for (const t of ['today','month','money','week']){
    const on = t === which;
    document.getElementById('panel' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', on);
    document.getElementById('tab'   + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', on);
  }
}

document.getElementById('mDate').value = ymdOf(new Date());
setKind('in');

/* ---------- 비밀번호 잠금 ---------- */
(function setupLock(){
  const box = document.getElementById('lockScreen');
  const input = document.getElementById('lockInput');
  const msg = document.getElementById('lockMsg');
  const isLocked = () => document.documentElement.classList.contains('locked');

  if (isLocked()) setTimeout(() => input.focus(), 60);

  input.addEventListener('input', () => {
    const v = input.value.replace(/[^0-9]/g, '');
    if (v !== input.value) input.value = v;
    msg.classList.remove('err');
    if (v.length < 6) return;

    const code = LOCK.hash(v);
    const role = LOCK.roleOf(code);
    if (role){
      try { localStorage.setItem(LOCK.KEY, code); } catch (e) {}
      document.documentElement.classList.remove('locked');
      document.documentElement.classList.toggle('admin', role === 'admin');
      input.value = '';
      input.blur();
      msg.textContent = '이 기기에서는 처음 한 번만 입력하면 됩니다';
      renderNotice();                   // 권한에 따라 수정 버튼이 달라진다
      renderToday();                    // 잠금 중 멈춰 있던 화면을 새로 맞춘다
    } else {
      box.classList.add('shake');
      setTimeout(() => box.classList.remove('shake'), 400);
      msg.textContent = '비밀번호가 맞지 않습니다';
      msg.classList.add('err');
      input.value = '';
    }
  });
})();

function renderAll(){
  if (!noticeEditing) renderNotice();   // 입력 중인 공지는 건드리지 않는다
  renderToday(); renderMonth(); renderMoney(); renderWeek();
}

/* ---------- 동기화 계층과의 연결 ---------- */
const SYNC_LABEL = {
  local:      ['#9ca3af', '이 기기에만 저장'],
  connecting: ['#f59e0b', '연결 중…'],
  live:       ['#10b981', '실시간 동기화 중'],
  error:      ['#ef4444', '동기화 오류'],
};
function setSyncStatus(state, detail){
  const [color, label] = SYNC_LABEL[state] || SYNC_LABEL.local;
  const el = document.getElementById('syncBadge');
  el.innerHTML = `<i style="background:${color}"></i>${label}`;
  el.title = detail ? `${label} — ${detail}` : label;
}

window.familyApp = {
  setSyncStatus,
  /* 원격으로 보낼 전체 스냅샷 */
  snapshot: () => ({ weekly: data, events, money, moods, says, notice }),
  /* 원격에서 받은 내용을 로컬에 반영 (되돌려 보내지 않는다) */
  apply(remote){
    if (!remote || typeof remote !== 'object') return;
    if (remote.weekly) { data   = mergeWeekly(remote.weekly);  put(STORE_KEY,  data); }
    if (remote.events) { events = cleanEvents(remote.events);   put(EVENTS_KEY, events); }
    if (remote.money)  { money  = cleanMoney(remote.money);     put(MONEY_KEY,  money); }
    if (remote.moods)  { moods  = cleanMoods(remote.moods);     put(MOOD_KEY,   moods); }
    if (remote.says)   { says   = cleanSays(remote.says);       put(SAYS_KEY,   says); }
    if (typeof remote.notice === 'string'){
      notice = remote.notice.slice(0, 500);
      try{ localStorage.setItem(NOTICE_KEY, notice); }catch(e){}
    }
    renderAll();
  },
  /* 동기화 계층이 자신의 push 함수를 여기에 등록한다 */
  set onChange(fn){ onLocalChange = fn; },
  get onChange(){ return onLocalChange; },
};

setSyncStatus('local');
renderNotice();
renderToday();
renderMonth();
renderMoney();
renderWeek();
setInterval(renderToday, 60000);   // 1분마다 상태 갱신

/* 서비스워커 등록 — 안드로이드에서 독립된 앱으로 설치되게 해준다.
   file:// 로 열었거나 지원하지 않는 브라우저면 조용히 넘어간다. */
if ('serviceWorker' in navigator && location.protocol === 'https:'){

    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

<!-- ══════════════════════════════════════════════════════════════════════════
     실시간 동기화 계층
     FIREBASE_CONFIG 가 비어 있으면 아무것도 하지 않고 로컬 전용으로 남는다.
     ══════════════════════════════════════════════════════════════════════════ -->
<script type="module">
const cfg = window.SUPABASE_CONFIG || {};
const app = window.familyApp;
const ROW = cfg.familyId || 'lhk-family';

/* 내가 보낸 변경이 되돌아왔을 때 무시하기 위한 기기 식별자 */
const ME = Math.random().toString(36).slice(2) + Date.now().toString(36);

if (!cfg.url || !cfg.anonKey){
  app.setSyncStatus('local', '동기화 설정이 비어 있습니다');
} else {
  app.setSyncStatus('connecting');
  try{
    const { createClient } =
      await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const sb = createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false } });

    let applying = false;   // 원격 반영 중에는 되돌려 보내지 않는다
    let timer = null;

    async function push(){
      const { error } = await sb.from('family_state').upsert({
        id: ROW,
        data: app.snapshot(),
        writer: ME,
        updated_at: new Date().toISOString(),
      });
      if (error) app.setSyncStatus('error', error.message);
    }

    app.onChange = () => {
      if (applying) return;
      clearTimeout(timer);
      timer = setTimeout(push, 500);   // 연속 입력을 묶어서 한 번에 전송
    };

    function receive(row){
      if (!row || row.writer === ME) return;   // 내가 보낸 것은 무시
      applying = true;
      try{ app.apply(row.data); } finally { applying = false; }
    }

    /* 첫 로드 — 서버에 내용이 있으면 그것을 따르고, 없으면 이 기기 내용으로 시작 */
    const { data: row, error } = await sb
      .from('family_state').select('data, writer').eq('id', ROW).maybeSingle();
    if (error) throw error;
    if (row){
      applying = true;
      try{ app.apply(row.data); } finally { applying = false; }
    } else {
      await push();
    }

    /* 이후 변경을 실시간으로 수신 */
    sb.channel('family-state')
      .on('postgres_changes',
          { event: '*', schema: 'public', table: 'family_state', filter: `id=eq.${ROW}` },
          payload => receive(payload.new))
      .subscribe(status => {
        if (status === 'SUBSCRIBED')       app.setSyncStatus('live');
        else if (status === 'CHANNEL_ERROR') app.setSyncStatus('error', '실시간 연결 실패');
        else if (status === 'TIMED_OUT')     app.setSyncStatus('error', '연결 시간 초과');
      });

  }catch(e){
    app.setSyncStatus('error', e.message || String(e));
  }
}
</script>
