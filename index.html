/* ---------- 한자 따라 쓰기 ----------
   글자가 뜨면 먼저 획순을 한 획씩 그려 보여주고, 끝나면 그 위에 따라 쓴다.
   획순 자료는 공개 자료(hanzi-writer-data)를 받아 쓰고, 한 번 받으면 저장해 둔다.
   못 받으면 안내만 건너뛰고 따라 쓰기는 그대로 된다. */
const STROKE_CDN = 'https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1';
/* 획순 자료에 없는 글자는 획순이 같은 비슷한 글자로 안내한다 */
const STROKE_ALT = { '敎': '教' };
const strokeCache = new Map();

async function strokeDataOf(ch){
  const key = STROKE_ALT[ch] || ch;
  if (strokeCache.has(key)) return strokeCache.get(key);
  /* 지난번에 받아 둔 것이 있으면 그것을 쓴다 (인터넷이 없어도 열린다) */
  try{
    const saved = localStorage.getItem('family-stroke-' + key);
    if (saved){
      const d = JSON.parse(saved);
      strokeCache.set(key, d);
      return d;
    }
  }catch(e){}
  try{
    const res = await fetch(`${STROKE_CDN}/${encodeURIComponent(key)}.json`);
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    const d = { strokes: j.strokes || [], medians: j.medians || [] };
    if (!d.strokes.length) throw new Error('빈 자료');
    strokeCache.set(key, d);
    try{ localStorage.setItem('family-stroke-' + key, JSON.stringify(d)); }catch(e){}
    return d;
  }catch(e){
    /* 실패는 기억해 두지 않는다 — 인터넷이 잠깐 끊겼을 뿐이면 다시 눌러서 받을 수 있게 */
    return null;
  }
}

let traceState = null;   // { list, at, strokes, drawing, phase, anim }

function openTrace(i){
  const hs = wordsOfDay(HANJA, ymdOf(new Date()), 2);
  traceState = { list: hs, at: Math.max(0, Math.min(hs.length - 1, i | 0)),
                 strokes: [], drawing: null, phase: 'guide', anim: 0, counted: false };
  document.getElementById('traceDlg').showModal();
  renderTrace();
  playGuide();
}

/* ── 획순 안내 ── */
const GUIDE_MS = 620;        // 한 획 그리는 데 걸리는 시간
const GUIDE_GAP = 180;       // 획과 획 사이 쉬는 시간
let guideTimers = [];

function stopGuide(){
  guideTimers.forEach(clearTimeout);
  guideTimers = [];
}

async function playGuide(){
  const s = traceState;
  if (!s) return;
  stopGuide();
  const h = s.list[s.at];
  const wrap = document.getElementById('traceGuide');
  const note = document.getElementById('traceNote');
  const run = ++s.anim;                       // 도중에 글자가 바뀌면 옛 안내는 버린다

  s.phase = 'guide';
  renderTraceMode();
  note.textContent = '획순을 불러오는 중…';
  wrap.innerHTML = '';
  document.getElementById('tracePad').classList.remove('has-guide');

  const data = await strokeDataOf(h.c);
  if (!traceState || traceState !== s || s.anim !== run) return;

  if (!data){
    s.phase = 'trace';
    note.textContent = '획순 안내를 불러오지 못했어요 — 그냥 따라 써 보세요';
    renderTraceMode();
    return;
  }
  document.getElementById('tracePad').classList.add('has-guide');

  note.textContent = STROKE_ALT[h.c]
    ? `획순 보는 중 — 모양이 거의 같은 ${STROKE_ALT[h.c]} 로 안내해요`
    : '획순 보는 중…';

  /* 1024×1024 자리에 그려진 자료라, 창 크기에 맞추고 위아래를 뒤집는다 */
  const S = 1024;
  wrap.innerHTML = `
    <svg viewBox="0 0 ${S} ${S}" aria-hidden="true">
      <g transform="translate(0, ${S}) scale(1, -1)">
        ${data.strokes.map((d, i) => `
          <mask id="gm${i}" maskUnits="userSpaceOnUse" x="0" y="0" width="${S}" height="${S}">
            <polyline points="${(data.medians[i] || []).map(p => p.join(',')).join(' ')}"
              fill="none" stroke="#fff" stroke-width="160"
              stroke-linecap="round" stroke-linejoin="round" id="gp${i}"/>
          </mask>
          <path d="${d}" mask="url(#gm${i})" class="g-stroke" id="gs${i}"/>`).join('')}
      </g>
    </svg>`;

  /* 각 획을 median 을 따라 자라나게 해서 쓰는 방향까지 보이게 한다 */
  const lens = data.strokes.map((_, i) => {
    const p = document.getElementById('gp' + i);
    const len = p.getTotalLength ? p.getTotalLength() : 1000;
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.transition = `stroke-dashoffset ${GUIDE_MS}ms linear`;
    return len;
  });

  data.strokes.forEach((_, i) => {
    guideTimers.push(setTimeout(() => {
      if (!traceState || traceState !== s || s.anim !== run) return;
      document.getElementById('gs' + i)?.classList.add('on');
      const p = document.getElementById('gp' + i);
      if (p) p.style.strokeDashoffset = 0;
      note.textContent = `획순 보는 중 — ${i + 1} / ${lens.length}획`;
    }, i * (GUIDE_MS + GUIDE_GAP)));
  });

  guideTimers.push(setTimeout(() => {
    if (!traceState || traceState !== s || s.anim !== run) return;
    s.phase = 'trace';
    note.textContent = '이제 따라 써 보세요';
    renderTraceMode();
  }, lens.length * (GUIDE_MS + GUIDE_GAP) + 350));
}

function replayGuide(){ if (traceState) playGuide(); }

/* 안내를 보는 중에는 그림판을 잠근다 */
function renderTraceMode(){
  const guide = traceState?.phase === 'guide';
  document.getElementById('tracePad').classList.toggle('guiding', guide);
  document.getElementById('traceReplay').disabled = guide;
}

function traceChar(){ return traceState ? traceState.list[traceState.at] : null; }

function renderTrace(){
  const h = traceChar();
  if (!h) return;
  document.getElementById('traceTitle').textContent = `${h.c} ${h.m} ${h.s}`;
  document.getElementById('traceSub').textContent = `${h.w} · ${h.wm}`;
  document.getElementById('traceGhost').textContent = h.c;
  document.getElementById('traceNext').textContent =
    traceState.list.length > 1 ? '다음 글자' : '다시';
  fitTraceCanvas();
  renderTraceCount();
}

/* 획을 정말로 밑그림을 따라 그었는지 본다.
   시작점과 끝점이 그 획의 한가운데 선(median) 양 끝 가까이 있으면 인정한다.
   획순 자료가 없으면 획수만 보고 넘어간다. */
function traceLooksRight(){
  const s = traceState, h = traceChar();
  if (!s || !h) return false;
  const need = STROKES[h.c];
  if (!need || s.strokes.length !== need) return false;

  const d = strokeCache.get(STROKE_ALT[h.c] || h.c);
  if (!d?.medians?.length) return true;               // 밑그림이 없으면 획수만 본다

  const r = document.getElementById('tracePad').getBoundingClientRect();
  const k = Math.min(r.width, r.height) / 1024;
  const ox = (r.width  - 1024 * k) / 2, oy = (r.height - 1024 * k) / 2;
  const pt = ([x, y]) => ({ x: ox + x * k, y: oy + (1024 - y) * k });
  const tol = Math.min(r.width, r.height) * 0.3;      // 넉넉하게 봐준다
  const near = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) <= tol;

  for (let i = 0; i < need; i++){
    const m = d.medians[i];
    if (!m || m.length < 2) continue;
    const mine = s.strokes[i];
    if (!mine || !mine.length) return false;
    if (!near(mine[0], pt(m[0]))) return false;
    if (!near(mine[mine.length - 1], pt(m[m.length - 1]))) return false;
  }
  return true;
}

/* 한 글자를 바르게 다 썼으면 오늘 횟수를 하나 올린다 (한 번 센 것은 다시 안 센다) */
function countTraceDone(){
  const s = traceState;
  const who = LOCK.who();
  if (!s || !who || s.counted) return;
  if (!traceLooksRight()) return;
  s.counted = true;
  const key = ymdOf(new Date());
  const day = traced[key] || (traced[key] = {});
  const mine = day[who] || (day[who] = {});
  const ch = traceChar().c;
  mine[ch] = (mine[ch] || 0) + 1;      // 글자마다 따로 센다
  saveTraced();
  renderMoney();                    // 미션 용돈에 바로 반영
  renderTraceCount();
}

function renderTraceCount(){
  const h = traceChar();
  const total = STROKES[h.c];
  const n = traceState.strokes.length;
  const el = document.getElementById('traceCount');
  const me = LOCK.who();
  const isKid = KIDS.some(k => k.key === me);
  const done = me ? tracedToday(me) : 0;

  let line = !total ? `${n}획 그었어요`
    : traceState.counted ? `<b class="done">${n}획 — 잘 썼어요! 🎉</b>`
    : n === total ? `<b>${n}</b> / ${total}획 · 밑그림을 따라 다시 써 보세요`
    : `<b>${n}</b> / ${total}획` + (n > total ? ' · 너무 많아요' : '');
  el.innerHTML = line;
  el.classList.toggle('over', !!total && n > total && !traceState.counted);

  /* 아이에게는 오늘 몇 회 채웠는지와 미션 용돈을 함께 보여준다.
     두 글자를 다 써야 1회이므로 글자마다 몇 번 썼는지도 나란히 보여준다. */
  const bar = document.getElementById('traceGoal');
  if (!isKid){ bar.hidden = true; return; }
  bar.hidden = false;
  const each = tracedCounts(me);
  const hit = Math.min(done, TRACE_GOAL);
  bar.innerHTML = `
    <div class="tg-line">
      <span>오늘 연습 <b>${done}</b> / ${TRACE_GOAL}회</span>
      ${done >= TRACE_GOAL
        ? `<span class="tg-got">🎉 미션 용돈 ${TRACE_PAY}원</span>`
        : `<span class="tg-left">${TRACE_GOAL - done}회 더 하면 ${TRACE_PAY}원</span>`}
    </div>
    <div class="tg-bar"><i style="width:${hit / TRACE_GOAL * 100}%"></i></div>
    <div class="tg-each">두 글자를 다 써야 1회 —
      ${each.map(x => `<span class="${x.n >= TRACE_GOAL ? 'ok' : ''}${
        x.c === h.c ? ' now' : ''}">${x.c} ${x.n}번</span>`).join('')}</div>`;
}

/* 화면 크기에 맞춰 그림판을 다시 잡는다 (선명하게 그리려고 화면 배율만큼 키운다) */
function fitTraceCanvas(){
  const cv = document.getElementById('traceCanvas');
  const pad = document.getElementById('tracePad');
  const r = pad.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.max(1, Math.round(r.width  * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  cv.style.width = r.width + 'px';
  cv.style.height = r.height + 'px';
  /* 흐릿한 글자는 그림판 안에 꽉 차되 넘치지 않게 —
     글꼴마다 글자가 차지하는 높이가 달라, 줄이면서 맞춰 넣는다 */
  const ghost = document.getElementById('traceGhost');
  const box = Math.min(r.width, r.height);
  for (let f = Math.round(box * 0.74); f >= 24; f -= 4){
    ghost.style.fontSize = f + 'px';
    if (ghost.scrollWidth <= r.width && ghost.scrollHeight <= r.height) break;
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redrawTrace();
}

function redrawTrace(){
  const cv = document.getElementById('traceCanvas');
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, cv.width / dpr, cv.height / dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const all = traceState.drawing ? [...traceState.strokes, traceState.drawing] : traceState.strokes;
  all.forEach((stroke, i) => {
    if (!stroke.length) return;
    /* 나중에 그은 획일수록 진하게 — 순서가 눈에 보이도록 */
    const t = all.length > 1 ? i / (all.length - 1) : 1;
    ctx.strokeStyle = `hsl(222 80% ${52 - t * 18}%)`;
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(stroke[0].x, stroke[0].y);
    if (stroke.length === 1) ctx.lineTo(stroke[0].x + 0.1, stroke[0].y);
    else for (let k = 1; k < stroke.length; k++) ctx.lineTo(stroke[k].x, stroke[k].y);
    ctx.stroke();
    /* 획 번호를 시작점에 작게 적는다 */
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(stroke[0].x, stroke[0].y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsl(222 80% ${52 - t * 18}%)`;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), stroke[0].x, stroke[0].y + 0.5);
  });
}

function undoStroke(){
  if (!traceState || !traceState.strokes.length) return;
  traceState.strokes.pop();
  redrawTrace(); renderTraceCount();
}
function clearTrace(){
  if (!traceState) return;
  traceState.strokes = [];
  traceState.drawing = null;
  traceState.counted = false;      // 지우고 다시 쓰면 한 번 더 셀 수 있다
  redrawTrace(); renderTraceCount();
}
function nextTrace(){
  if (!traceState) return;
  traceState.at = (traceState.at + 1) % traceState.list.length;
  traceState.strokes = [];
  traceState.drawing = null;
  traceState.counted = false;
  renderTrace();
  playGuide();               // 글자가 바뀌면 획순부터 다시 보여준다
}
function closeTrace(){
  stopGuide();
  traceState = null;
  document.getElementById('traceGuide').innerHTML = '';
  document.getElementById('traceDlg').close();
}

(function setupTrace(){
  const cv = document.getElementById('traceCanvas');
  const at = e => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener('pointerdown', e => {
    if (!traceState) return;
    e.preventDefault();
    cv.setPointerCapture?.(e.pointerId);
    traceState.drawing = [at(e)];
    redrawTrace();
  });
  cv.addEventListener('pointermove', e => {
    if (!traceState?.drawing) return;
    e.preventDefault();
    traceState.drawing.push(at(e));
    redrawTrace();
  });
  const end = () => {
    if (!traceState?.drawing) return;
    traceState.strokes.push(traceState.drawing);
    traceState.drawing = null;
    redrawTrace();
    countTraceDone();          // 다 썼으면 오늘 횟수에 더한다
    renderTraceCount();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', end);
  /* 화면을 돌리거나 크기가 바뀌면 그림판도 다시 잡는다 */
  window.addEventListener('resize', () => { if (traceState) fitTraceCanvas(); });
})();

/* ---------- 오늘의 시험 ----------
   문제는 날짜만으로 정해진다. 그래서 온 가족이 같은 날 같은 문제를 풀고,
   다시 풀어도 문제와 보기 순서가 그대로다. */
const QUIZ_N = 10;                     // 한 과목에 열 문제
const QUIZ_CHOICES = 5;                // 5지선다
const QUIZ_KINDS = [
  { key:'hanja', name:'한자', label:'오늘의 한자 · 8급' },
  { key:'eng',   name:'영어', label:'오늘의 영어 · 중2' },
];
const quizKindOf = k => QUIZ_KINDS.find(x => x.key === k) || QUIZ_KINDS[0];

/* 같은 글에서 늘 같은 숫자가 나오는 셈 (FNV-1a → 선형 합동) */
function quizSeed(text){
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++){
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}
function quizRnd(seed){
  let s = seed >>> 0;
  return () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
/* 순서를 섞는다 — 같은 rnd 를 쓰면 늘 같은 순서가 된다 */
function quizShuffle(arr, rnd){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 날짜를 며칠 옮긴다 (2026-08-01 에서 -1 → 2026-07-31) */
function shiftDay(dateKey, n){
  return new Date(Date.parse(dateKey + 'T00:00:00Z') + n * 86400000)
    .toISOString().slice(0, 10);
}

/* 최근 며칠 동안 '오늘의 한자·영어' 칸에 나왔던 것들의 자리번호 */
const QUIZ_RECENT_DAYS = 3;
function recentIdx(list, dateKey, perDay, days = QUIZ_RECENT_DAYS){
  const out = [];
  for (let back = 0; back < days; back++)
    for (const o of wordsOfDay(list, shiftDay(dateKey, -back), perDay)){
      const i = list.indexOf(o);
      if (i >= 0 && !out.includes(i)) out.push(i);
    }
  return out;
}

/* 한 묶음에서 n 문제를 뽑는다. must 에 든 것은 반드시 넣는다
   (요 며칠 오늘의 한자·영어에 나왔던 것들).
   보기는 같은 묶음 안에서만 고른다 — 낱말 문제에 숙어를 섞으면 답이 뻔히 보이기 때문. */
function quizPick(list, n, rnd, ask, answer, hint, must = []){
  const all = [...list.keys()];
  const forced = must.filter(i => i >= 0 && i < list.length).slice(0, n);
  const rest = quizShuffle(all.filter(i => !forced.includes(i)), rnd)
    .slice(0, Math.max(0, n - forced.length));
  return quizShuffle([...forced, ...rest], rnd).map(i => {
    /* 정답과 같은 뜻이 보기에 두 번 나오지 않게 거른다 */
    const wrong = quizShuffle(all.filter(j => j !== i && answer(list[j]) !== answer(list[i])), rnd)
      .slice(0, QUIZ_CHOICES - 1);
    const picks = quizShuffle([i, ...wrong], rnd);
    return {
      ask: ask(list[i]),
      hint,
      options: picks.map(j => answer(list[j])),
      answer: picks.indexOf(i),
    };
  });
}

/* 그날의 문제 열 개를 만든다.
   요 사흘 동안 오늘의 한자·영어 칸에 나왔던 것들이 먼저 들어가고,
   모자란 만큼만 나머지에서 채운다. 영어는 낱말 다섯 + 숙어 다섯. */
function quizOfDay(dateKey, kind){
  const rnd = quizRnd(quizSeed(`lhk-quiz:${dateKey}:${kind}`));
  if (kind === 'hanja')
    return quizPick(HANJA, QUIZ_N, rnd, o => o.c, o => `${o.m} ${o.s}`, '훈과 음은?',
                    recentIdx(HANJA, dateKey, 2));

  const half = QUIZ_N / 2;
  const words  = quizPick(ENGLISH, half, rnd, o => o.w, o => o.m, '무슨 뜻일까요?',
                          recentIdx(ENGLISH, dateKey, 1));
  const idioms = quizPick(IDIOMS,  half, rnd, o => o.w, o => o.m, '무슨 뜻일까요?',
                          recentIdx(IDIOMS,  dateKey, 1));
  return quizShuffle([...words, ...idioms], rnd);
}

/* ---------- 미션 용돈 ----------
   ① 한자·영어 시험을 둘 다 100점 받은 날마다 1000원
   ② 오늘의 한자를 바르게 열 번 따라 쓴 날마다 100원
   둘 다 하루에 한 번씩만 쌓이고, 이번 달 것만 센다 —
   달이 바뀌면 따로 손대지 않아도 0부터 다시 시작한다. */
const MISSION_PAY = 1000;      // 시험 두 과목 100점
const TRACE_PAY   = 100;       // 따라 쓰기 열 번
const TRACE_GOAL  = 10;        // 하루 목표 횟수 (두 글자를 다 써야 1회)

function missionDays(kidKey, monthPrefix){
  const pre = monthPrefix || ymdOf(new Date()).slice(0, 7);
  return Object.entries(quiz)
    .filter(([date, byMember]) => date.startsWith(pre)
      && byMember?.[kidKey]?.hanja === 100 && byMember?.[kidKey]?.eng === 100)
    .map(([date]) => date)
    .sort();
}
/* 그날 한자 두 자를 각각 몇 번씩 썼는지 */
function tracedCounts(mKey, dateKey){
  const date = dateKey || ymdOf(new Date());
  const got = (traced[date] || {})[mKey] || {};
  return wordsOfDay(HANJA, date, 2).map(h => ({ c: h.c, n: got[h.c] || 0 }));
}
/* 두 글자를 모두 써야 1회 — 적게 쓴 쪽이 그날의 횟수가 된다 */
function traceRounds(mKey, dateKey){
  const list = tracedCounts(mKey, dateKey);
  return list.length ? Math.min(...list.map(x => x.n)) : 0;
}
function traceDays(kidKey, monthPrefix){
  const pre = monthPrefix || ymdOf(new Date()).slice(0, 7);
  return Object.keys(traced)
    .filter(date => date.startsWith(pre) && traceRounds(kidKey, date) >= TRACE_GOAL)
    .sort();
}
function missionPay(kidKey, monthPrefix){
  return missionDays(kidKey, monthPrefix).length * MISSION_PAY
       + traceDays(kidKey, monthPrefix).length * TRACE_PAY;
}
/* 오늘 몇 회 채웠는지 (두 글자를 다 써야 1회) */
function tracedToday(mKey){
  return traceRounds(mKey);
}

/* 아이는 오늘의 한자를 열 번 따라 써야 시험을 볼 수 있다.
   어른은 따라 쓰기 미션이 없으므로 그냥 볼 수 있다. */
function canQuiz(mKey){
  if (!KIDS.some(k => k.key === mKey)) return true;
  return traceRounds(mKey) >= TRACE_GOAL;
}

/* 다음 달 이름 — 12월 다음은 1월 */
function nextMonthLabel(){
  const d = new Date();
  return ((d.getMonth() + 1) % 12) + 1;
}

/* 점수 읽기 — 없으면 null */
function quizScore(mKey, kind, dateKey){
  const got = (quiz[dateKey || ymdOf(new Date())] || {})[mKey];
  const n = got?.[kind];
  return Number.isFinite(n) ? n : null;
}

/* ---------- 시험 팝업 ---------- */
let quizState = null;      // { member, kind, list, at, right, done }

function openQuiz(mKey, kind){
  if (!LOCK.canEdit(mKey)) return;
  /* 따라 쓰기를 아직 다 못했으면 시험 대신 따라 쓰기 창을 열어 준다 */
  if (!canQuiz(mKey)){ openTrace(0); return; }
  quizState = {
    member: mKey,
    kind,
    date: ymdOf(new Date()),
    list: quizOfDay(ymdOf(new Date()), kind),
    at: 0, right: 0, picked: null, done: false,
  };
  renderQuiz();
  document.getElementById('quizDlg').showModal();
}

function renderQuiz(){
  const s = quizState;
  if (!s) return;
  const m = memberOf(s.member), k = quizKindOf(s.kind);
  const box = document.getElementById('quizBody');
  document.getElementById('quizTitle').textContent = `${k.label} 시험`;
  document.getElementById('quizWho').textContent = `${m.name} · 10문제`;

  if (s.done){
    const score = s.right * 10;
    const face = score === 100 ? '🏆' : score >= 80 ? '🎉' : score >= 50 ? '🙂' : '💪';
    box.innerHTML = `
      <div class="quiz-done">
        <div class="q-face">${face}</div>
        <div class="q-score" style="--c:${m.color}"><b>${score}</b><span>점</span></div>
        <p class="q-sub">10문제 중 ${s.right}문제를 맞혔어요</p>
        ${s.wrongList.length ? `
          <div class="q-review">
            <div class="q-review-head">틀린 문제 다시 보기</div>
            ${s.wrongList.map(w => `
              <div class="q-review-row">
                <b>${esc(w.ask)}</b>
                <span>${esc(w.right)}</span>
              </div>`).join('')}
          </div>` : ''}
      </div>`;
    document.getElementById('quizRetry').hidden = false;
    document.getElementById('quizProgress').style.setProperty('--p', '100%');
    return;
  }

  document.getElementById('quizRetry').hidden = true;
  const q = s.list[s.at];
  document.getElementById('quizProgress').style.setProperty('--p', (s.at / QUIZ_N * 100) + '%');
  box.innerHTML = `
    <div class="q-step">${s.at + 1} / ${QUIZ_N}</div>
    <div class="q-ask ${s.kind}">${esc(q.ask)}</div>
    <div class="q-hint">${q.hint}</div>
    <div class="q-opts">
      ${q.options.map((o, i) => {
        let cls = '';
        if (s.picked !== null){
          if (i === q.answer) cls = 'right';
          else if (i === s.picked) cls = 'wrong';
        }
        return `<button type="button" class="q-opt ${cls}" ${s.picked !== null ? 'disabled' : ''}
                  onclick="answerQuiz(${i})">
                  <span class="q-num">${i + 1}</span>${esc(o)}
                </button>`;
      }).join('')}
    </div>`;
}

function answerQuiz(i){
  const s = quizState;
  if (!s || s.done || s.picked !== null) return;
  const q = s.list[s.at];
  s.picked = i;
  if (i === q.answer) s.right++;
  else (s.wrongList ||= []).push({ ask: q.ask, right: q.options[q.answer] });
  renderQuiz();
  /* 정답을 잠깐 보여준 뒤 다음 문제로 */
  setTimeout(() => {
    if (quizState !== s) return;
    s.picked = null;
    s.at++;
    if (s.at >= QUIZ_N){
      s.done = true;
      s.wrongList ||= [];
      finishQuiz(s);
    }
    renderQuiz();
  }, 850);
}

function finishQuiz(s){
  if (!LOCK.canEdit(s.member)) return;
  const day = quiz[s.date] || (quiz[s.date] = {});
  const one = day[s.member] || (day[s.member] = {});
  one[s.kind] = s.right * 10;          // 다시 풀면 마지막 점수로 바뀐다
  saveQuiz();
  renderToday();
}

/* 같은 문제로 다시 푼다 */
function retryQuiz(){
  const s = quizState;
  if (!s) return;
  openQuiz(s.member, s.kind);
}

function closeQuiz(){
  quizState = null;
  document.getElementById('quizDlg').close();
}

/* 발음 듣기 — 기기에 내장된 목소리를 쓴다 */
function speak(word, btn){
  if (!('speechSynthesis' in window)){
    alert('이 브라우저에서는 발음 듣기를 지원하지 않아요.');
    return;
  }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.85;
    if (btn){
      btn.classList.add('on');
      const off = () => btn.classList.remove('on');
      u.onend = off; u.onerror = off;
      setTimeout(off, 4000);          // 목소리가 없어 조용히 끝나는 경우 대비
    }
    speechSynthesis.speak(u);
  }catch(err){
    alert('발음을 재생할 수 없습니다.');
  }
}

/* ---------- 월간 달력 ---------- */
let view = new Date();
view.setDate(1);

function moveMonth(step){
  if (step === 0) { view = new Date(); view.setDate(1); }
  else view = new Date(view.getFullYear(), view.getMonth() + step, 1);
  renderMonth();
}

function renderMonth(){
  const y = view.getFullYear(), mo = view.getMonth();
  document.getElementById('calTitle').textContent = `${y}년 ${mo + 1}월`;

  const firstDow = new Date(y, mo, 1).getDay();     // 0=일
  const lastDate = new Date(y, mo + 1, 0).getDate();
  const todayKey = ymdOf(new Date());
  let html = '';

  for (let i = 0; i < firstDow; i++) html += `<div class="cell blank"></div>`;

  for (let d = 1; d <= lastDate; d++){
    const key = ymd(y, mo, d);
    const dow = new Date(y, mo, d).getDay();
    const hol = holidayOf(key);
    const list = [...(events[key] || [])].sort(byTime);
    const shown = list.slice(0, 2);

    const cls = ['cell'];
    if (dow === 0) cls.push('sun');
    if (dow === 6) cls.push('sat');
    if (hol?.off) cls.push('holiday');          // 쉬는 날만 빨갛게
    if (key === todayKey) cls.push('today');
    if (hasNew(`month:${key}`)) cls.push('is-new');   // 가족이 새로 넣은 날

    /* 색은 사람을 구분한다. 첫 줄에 이름과 시간, 둘째 줄에 메모를 적는다. */
    const chips = shown.map(e => {
      const m = memberOf(e.member);
      const head = `${m.name}${e.time ? ' ' + e.time : ''}`;
      return `<span class="mchip" style="--c:${m.color}"
          title="${esc(head + (e.memo ? ' · ' + e.memo : ''))}">
          <b>${head}</b>
          ${e.memo ? `<i>${esc(e.memo)}</i>` : ''}
        </span>`;
    }).join('');

    html += `<div class="${cls.join(' ')}" onclick="openDay('${key}')">
        <span class="num-row">
          <span class="num">${d}</span>
          ${hol ? `<span class="hol ${hol.off ? '' : 'memo'}"
             ><b class="lg">${hol.name}</b><b class="sm">${holShort(hol.name)}</b></span>` : ''}
        </span>
        ${chips}
        ${list.length > 2 ? `<span class="more">+${list.length - 2}건</span>` : ''}
      </div>`;
  }

  const trailing = (7 - ((firstDow + lastDate) % 7)) % 7;
  for (let i = 0; i < trailing; i++) html += `<div class="cell blank"></div>`;

  document.getElementById('calBody').innerHTML = html;
}

  document.getElementById('dayRegular').innerHTML = MEMBERS.map(m => {
    const s = data[m.key][DAYS[di].key];
    const txt = (s.go || s.back)
      ? `${m.goLabel} ${s.go || '—'} · ${m.backLabel} ${s.back || '—'}`

        `<span class="chip" style="background:#f3e8ff;color:#7e22ce">🎒 ${esc(a)}</span>`),

    pickable.map((m, i) => `<option value="${m.key}"${i === 0 ? ' selected' : ''}>${m.name}</option>`).join('');
  /* 로그인하지 않았거나 고를 사람이 없으면 넣는 칸을 아예 잠근다 */
  document.getElementById('addForm').hidden = !pickable.length;

  document.getElementById('addMemo').value = '';

  document.getElementById('dayDlg').showModal();

function renderDayEvents(){
  const list = [...(events[openedDate] || [])].sort(byTime);
  document.getElementById('dayEvents').innerHTML = list.length
    ? list.map(e => {
        const m = memberOf(e.member);
        /* 온가족 일정은 관리자만, 나머지는 그 사람(과 관리자)만 지울 수 있다 */
        const mayDel = e.member === 'all' ? LOCK.isAdmin() : LOCK.canEdit(e.member);
        return `<div class="ev-item" style="--c:${m.color}">
            ${e.time ? `<b class="ev-time">${e.time}</b>` : ''}
            <span>${m.name}</span>
            ${e.memo ? `<span class="memo">${esc(e.memo)}</span>` : ''}

          </div>`;
      }).join('')
    : `<div class="empty" style="font-size:13px">등록된 특별 일정이 없습니다.</div>`;

document.getElementById('addBtn').onclick = () => {
  if (!openedDate) return;
  const timeEl = document.getElementById('addTime');
  const time = parseTime(timeEl.value);         // 비워두면 '', 잘못 쓰면 null

function delEvent(id){
  const ev = (events[openedDate] || []).find(e => e.id === id);
  if (!ev) return;
  if (ev.member === 'all' ? !LOCK.isAdmin() : !LOCK.canEdit(ev.member)) return;
  events[openedDate] = (events[openedDate] || []).filter(e => e.id !== id);
  if (!events[openedDate].length) delete events[openedDate];
  saveEvents();
  renderDayEvents(); renderMonth(); renderToday();
}

/* ---------- 용돈기입장 ---------- */

function setKid(k){ curKid = k; renderMoney(); scheduleSeen(); }

/* ---------- 용돈: 달 넘기기 ---------- */
let moneyMonth = null;                       // 'YYYY-MM' — 지금 보고 있는 달
function thisMonthKey(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
}
/* step 이 0 이면 이번 달로 돌아온다 */
function moveMoneyMonth(step){
  if (!step){ moneyMonth = thisMonthKey(); renderMoney(); return; }
  const [y, m] = (moneyMonth || thisMonthKey()).split('-').map(Number);
  const d = new Date(y, m - 1 + step, 1);
  const next = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  if (next > thisMonthKey()) return;         // 앞으로는 이번 달까지만
  moneyMonth = next;
  renderMoney();
}

/* 미션을 해낸 날들을 작은 딱지로 늘어놓는다 */
function dayChips(icon, days, emptyText){
  if (!days.length) return `<div class="plan-days empty">${icon} ${emptyText}</div>`;
  return `<div class="plan-days"><span class="p-icon">${icon}</span>${days.map(d => {
    const [, m, dd] = d.split('-');
    return `<span class="p-day">${+m}/${+dd}</span>`;

function renderPlan(kid){
  const base = plan[kid.key].base;
  const days = missionDays(kid.key);          // 시험 두 과목 100점인 날
  const tdays = traceDays(kid.key);            // 한자를 열 번 따라 쓴 날
  const mission = days.length * MISSION_PAY + tdays.length * TRACE_PAY;
  const may = LOCK.isParent();               // 기본 용돈은 어른만 고친다

  document.getElementById('planCard').innerHTML = `
    <div class="plan-head">
      <h2>${nextMonthLabel()}월에 받을 용돈</h2>
      <span class="plan-who" style="--c:${kid.color}">${kid.emoji} ${kid.name}</span>
    </div>

      <div class="plan-box">
        <small>기본 용돈</small>

          ? `<input type="text" id="planBase" inputmode="numeric" maxlength="9"
               value="${base.toLocaleString('ko-KR')}" aria-label="${kid.name} 기본 용돈"
               onfocus="this.select()" onchange="setPlanBase(this.value, this)">`
          : `<b>${base.toLocaleString('ko-KR')}</b>`}
      </div>
      <div class="plan-box">
        <small>미션 용돈</small>
        <b>${mission.toLocaleString('ko-KR')}</b>
      </div>
      <div class="plan-box total" style="--c:${kid.color}">
        <small>합계</small>
        <b>${(base + mission).toLocaleString('ko-KR')}</b>
      </div>
    </div>
    <p class="plan-hint">
      ${may ? '' : '기본 용돈은 아빠·엄마가 정해요. '}미션 용돈은
      한자·영어 시험 <b>둘 다 100점</b> ${MISSION_PAY.toLocaleString('ko-KR')}원,
      오늘의 한자 <b>두 글자를 ${TRACE_GOAL}번씩 따라 쓰기</b> ${TRACE_PAY}원 ·
      각각 하루 한 번 · 달이 바뀌면 다시 0부터
    </p>
    ${dayChips('💯', days, '아직 두 과목 다 100점 받은 날이 없어요')}
    ${dayChips('✍️', tdays, `아직 두 글자를 ${TRACE_GOAL}번씩 다 쓴 날이 없어요`)}`;
}

function setPlanBase(raw, el){
  const back = () => { el.value = plan[curKid].base.toLocaleString('ko-KR'); };
  if (!LOCK.isParent()){ back(); return; }
  /* 20,000 처럼 쉼표를 넣어 쳐도 되고, 20000 이라고 쳐도 된다 */
  const s = String(raw).replace(/[,\s원]/g, '');
  const n = Math.round(Number(s));
  if (!/^\d+$/.test(s) || !Number.isFinite(n) || n > 1000000){
    back();                                   // 말이 안 되는 값은 되돌린다
    el.classList.add('bad');
    setTimeout(() => el.classList.remove('bad'), 900);
    return;
  }
  plan[curKid].base = n;
  savePlan();
  renderMoney();
}

/* 받았어요/썼어요 전환은 화면 상태일 뿐이라 누구나 눌러도 된다.
   실제로 적히는 곳(기록하기·영수증·삭제)에서 권한을 본다. */

/* 영수증에서 결제 금액을 골라낸다.
   승인번호·사업자번호·전화번호처럼 금액이 아닌 숫자가 많아, 큰 값을 고르는
   방식으로는 자주 틀린다. 줄과 숫자의 생김새에 점수를 매겨 판단한다. */
const AMOUNT_KEYS = /(합\s*계|총\s*액|총\s*합|결\s*제\s*금\s*액|승\s*인\s*금\s*액|청\s*구\s*금\s*액|총\s*구\s*매|받\s*을\s*금\s*액|total|amount)/i;
/* 합계를 이루는 조각들 — 이걸 결제 금액으로 착각하면 안 된다.
   예: 합계 6,500 = 판매금액(공급가액) 5,910 + 부가세 590 */
const PART_KEYS = /(판\s*매\s*금\s*액|공\s*급\s*가\s*액|과\s*세\s*물\s*품|면\s*세\s*물\s*품|부\s*가\s*세|봉\s*사\s*료|단\s*가)/i;
/* 금액이 아니라 번호가 적히는 줄 */
const NOISE_KEYS = /(승\s*인|가\s*맹|사\s*업\s*자|등\s*록|전\s*화|tel|카\s*드\s*번\s*호|일\s*련|거\s*래\s*번\s*호|단\s*말|pos|주\s*소|대\s*표|바\s*코\s*드|유\s*효|할\s*부|회\s*원|번\s*호|no\.)/i;
/* 결제 금액과 헷갈리기 쉬운 다른 금액이 적히는 줄 */
const OTHER_KEYS = /(거\s*스\s*름|잔\s*돈|받\s*은|현\s*금|신\s*용|체\s*크|봉\s*사\s*료|부\s*가|과\s*세|면\s*세|할\s*인|쿠\s*폰|적\s*립|포\s*인\s*트|잔\s*액)/i;

function candidatesIn(line){
  const out = [];
  const re = /(\d{1,3}(?:,\d{3})+|\d{2,10})(\s*원)?/g;
  let m;
  while ((m = re.exec(line)) !== null){
    const raw = m[1];
    const digits = raw.replace(/\D/g, '');
    const before = line[m.index - 1] || '';
    const after  = line[m.index + m[0].length] || '';
    out.push({
      value: Number(digits),
      len: digits.length,
      comma: raw.includes(','),
      won: !!m[2],
      /* 앞뒤에 숫자나 하이픈이 붙어 있으면 더 긴 번호의 일부다 (123-45-67890) */
      glued: /[\d\-*/]/.test(before) || /[\d\-*/]/.test(after),
    });
  }
  return out;
}

/* 그럴듯한 순서로 후보를 돌려준다 */
function amountCandidates(text){
  const lines = String(text).split(/\r?\n/);
  const found = [];

  lines.forEach((line, i) => {
    const prev = lines[i - 1] || '';
    /* '합계' 만 찍히고 숫자는 다음 줄에 오는 영수증이 많다 */
    const carried = AMOUNT_KEYS.test(prev) && candidatesIn(prev).length === 0;

    for (const c of candidatesIn(line)){
      if (c.value < 100 || c.value > 2000000) continue;
      let s = 0;
      if (AMOUNT_KEYS.test(line)) s += 60;
      if (carried)               s += 45;
      if (NOISE_KEYS.test(line)) s -= 80;
      if (PART_KEYS.test(line))  s -= 50;
      if (OTHER_KEYS.test(line)) s -= 55;
      if (c.comma)               s += 25;
      if (c.won)                 s += 20;
      if (c.glued)               s -= 60;
      if (c.len >= 8)            s -= 70;
      else if (c.len === 7)      s -= 20;
      if (c.value % 10 === 0)    s += 8;
      if (c.value > 300000)      s -= 15;
      /* 번호로 보이는 숫자는 후보에서 아예 뺀다.
         읽지 못했다고 알리는 편이, 엉뚱한 값을 채워 넣는 것보다 낫다. */
      if (s <= -40) continue;
      found.push({ value: c.value, score: s });
    }
  });

  /* 같은 금액은 가장 높은 점수만 남기되, 여러 번 찍혔다면 가점한다.
     결제 금액은 품목·합계·카드전표에 반복해서 찍히는 경우가 많다. */
  const best = new Map();
  const seen = new Map();
  for (const f of found){
    seen.set(f.value, (seen.get(f.value) || 0) + 1);
    if (!best.has(f.value) || best.get(f.value) < f.score) best.set(f.value, f.score);
  }
  return [...best.entries()]
    .map(([value, score]) => ({ value, score: score + Math.min(18, (seen.get(value) - 1) * 9) }))
    .sort((a, b) => (b.score - a.score) || (b.value - a.value));
}

function pickAmount(text){
  const list = amountCandidates(text);
  return list.length ? list[0].value : null;
}

/* 사진을 연다. 휴대폰이 남긴 방향 정보가 있으면 그대로 반영한다. */
async function loadPhoto(file){
  if ('createImageBitmap' in window){
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { /* 지원하지 않으면 아래로 */ }
  }
  return await new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 열 수 없습니다')); };
    img.src = url;
  });
}

/* 원하는 각도로 돌리면서 가로 maxW 이하로 줄인다 */
function rotateTo(src, deg, maxW){
  const sw = src.width, sh = src.height;
  const swap = deg === 90 || deg === 270;
  const scale = Math.min(1, maxW / (swap ? sh : sw));
  const cv = document.createElement('canvas');
  cv.width  = Math.round((swap ? sh : sw) * scale);
  cv.height = Math.round((swap ? sw : sh) * scale);
  const ctx = cv.getContext('2d');
  ctx.translate(cv.width / 2, cv.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(src, -sw * scale / 2, -sh * scale / 2, sw * scale, sh * scale);
  return cv;
}

/* 읽은 글자가 영수증답게 나왔는지 점수로 본다.
   사진이 돌아가 있으면 글자가 엉망으로 나오므로 이 점수가 낮다. */
function readQuality(text, cands){
  let q = 0;
  if (/합\s*계|금\s*액|승\s*인|영\s*수\s*증|카\s*드/.test(text)) q += 50;
  q += Math.min(30, (String(text).match(/\d{1,3},\d{3}/g) || []).length * 10);
  if (cands.length && cands[0].score >= 70) q += 40;
  return q;
}

let receiptWorker = null;

async function readReceipt(input){
  const file = input.files[0];
  input.value = '';
  if (!file || !LOCK.canEdit(curKid)) return;

  const dlg = document.getElementById('receiptDlg');
  const state = document.getElementById('receiptState');
  const form = document.getElementById('receiptForm');
  const saveBtn = document.getElementById('rSave');
  form.hidden = true; saveBtn.hidden = true;
  state.textContent = '사진을 준비하는 중이에요…';
  dlg.showModal();

  let amount = null;
  try{
    const photo = await loadPhoto(file);
    document.getElementById('receiptShot').src = rotateTo(photo, 0, 700).toDataURL('image/jpeg', 0.6);

    state.textContent = '글자를 읽는 중이에요… (처음엔 조금 걸려요)';
    const { createWorker } = await import('https://cdn.jsdelivr.net/npm/tesseract.js@5/+esm');
    if (!receiptWorker) receiptWorker = await createWorker(['kor', 'eng']);

    /* 영수증 사진은 옆으로 눕혀 찍는 경우가 많다. 돌려가며 읽어보고
       가장 잘 읽힌 방향을 쓴다. 잘 읽히면 그 자리에서 멈춘다. */
    let best = { quality: -1, list: [], deg: 0 };
    for (const deg of [0, 90, 270, 180]){
      if (deg) state.textContent = `사진을 ${deg}° 돌려 다시 읽는 중이에요…`;
      const cv = rotateTo(photo, deg, 1400);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
      const { data } = await receiptWorker.recognize(blob);
      const list = amountCandidates(data.text);
      const quality = readQuality(data.text, list);
      if (quality > best.quality){
        best = { quality, list, deg };
        document.getElementById('receiptShot').src = cv.toDataURL('image/jpeg', 0.5);
      }
      if (quality >= 90) break;
    }

    const list = best.list.slice(0, 4);
    amount = list.length ? list[0].value : null;
    showCandidates(list);
    state.textContent = amount
      ? (list.length > 1
          ? '금액이 다르면 아래에서 골라주세요'
          : '읽은 금액이 맞는지 확인해주세요')
      : '금액을 읽지 못했어요. 직접 적어주세요';
  }catch(err){
    showCandidates([]);
    state.textContent = '사진에서 글자를 읽지 못했어요. 금액을 직접 적어주세요';
  }

  document.getElementById('rAmount').value = amount ?? '';
  document.getElementById('rCat').innerHTML =
    CATS.out.map(c => `<option value="${c.k}">${c.e} ${c.n}</option>`).join('');
  document.getElementById('rMemo').value = '';
  document.getElementById('rDate').value = ymdOf(new Date());
  form.hidden = false;
  saveBtn.hidden = false;
  if (amount === null) document.getElementById('rAmount').focus();
}

    : '';

function renderMoney(){
  const kid = KIDS.find(k => k.key === curKid);
  const list = [...money[curKid]].sort((a, b) =>
    a.date === b.date ? b.id.localeCompare(a.id) : b.date.localeCompare(a.date));

  document.getElementById('kidTabs').innerHTML = KIDS.map(k =>
    `<button class="${k.key === curKid ? 'on' : ''}" style="--c:${k.color}"
       onclick="setKid('${k.key}')">${k.emoji} ${k.name}${newChip(`money:${k.key}`)}</button>`).join('');

  /* 자기 장부만 고칠 수 있다 (아빠는 관리자라 둘 다 고칠 수 있다) */
  const myMoney = LOCK.canEdit(curKid);
  document.getElementById('moneyForm').hidden = !myMoney;

  const bal = balanceOf(curKid);
  document.getElementById('balanceCard').style.setProperty('--c', kid.color);
  document.getElementById('balanceCard').innerHTML = `
    <div class="piggy">🐷</div>
    <small>${kid.name}이의 남은 용돈</small>
    <div class="amt ${bal < 0 ? 'minus' : ''}">${won(bal)}</div>`;

  renderPlan(kid);

  /* 달마다 따로 본다 — 지난달도 화살표로 넘겨서 볼 수 있다 */
  const prefix = (moneyMonth ||= thisMonthKey());
  const [my, mm] = prefix.split('-').map(Number);
  const month = list.filter(e => e.date.startsWith(prefix));
  const mIn  = month.filter(e => e.kind === 'in').reduce((s, e) => s + e.amount, 0);
  const mOut = month.filter(e => e.kind === 'out').reduce((s, e) => s + e.amount, 0);
  const thisM = thisMonthKey();
  document.getElementById('monthSum').innerHTML = `
    <div class="sum-head">
      <button type="button" class="sum-nav" title="지난달" onclick="moveMoneyMonth(-1)">◀</button>
      <b>${my}년 ${mm}월</b>
      <button type="button" class="sum-nav" title="다음달" onclick="moveMoneyMonth(1)"
        ${prefix >= thisM ? 'disabled' : ''}>▶</button>
      ${prefix === thisM ? '' :
        `<button type="button" class="btn sum-now" onclick="moveMoneyMonth(0)">이번 달로</button>`}
    </div>
    <div class="sum-boxes">
      <div class="sum-box in"><small>받은 돈</small><b>+${won(mIn)}</b></div>
      <div class="sum-box out"><small>쓴 돈</small><b>−${won(mOut)}</b></div>
      <div class="sum-box net" style="--c:${kid.color}"><small>남은 것</small><b>${won(mIn - mOut)}</b></div>
    </div>`;

  /* 내역 — 고른 달의 것만 보여준다 */
  if (!month.length){
    document.getElementById('ledger').innerHTML = list.length
      ? `<div class="led-empty">${mm}월에는 기록이 없어요<br>◀ ▶ 로 다른 달을 볼 수 있어요</div>`
      : `<div class="led-empty">아직 기록이 없어요 🐷<br>위에서 받은 돈이나 쓴 돈을 적어보세요!</div>`;
    return;
  }
  let html = '', lastDate = '';
  for (const e of month){
    if (e.date !== lastDate){
      lastDate = e.date;
      const [y, m, d] = e.date.split('-').map(Number);
      const dw = DAYS[(new Date(y, m - 1, d).getDay() + 6) % 7].short;
      html += `<div class="led-date">${m}월 ${d}일 (${dw})</div>`;
    }
    const c = catOf(e.kind, e.cat);
    const tint = e.kind === 'in' ? '#d1fae5' : '#fee2e2';
    html += `
      <div class="led-row">
        <span class="led-icon" style="background:${tint}">${c.e}</span>
        <span class="led-txt">
          <b>${e.memo ? esc(e.memo) : c.n}</b>
          <small>${c.n}${e.src === 'receipt' ? ' · 🧾 영수증' : ''}</small>
        </span>
        <span class="led-amt ${e.kind}">${e.kind === 'in' ? '+' : '−'}${won(e.amount)}</span>
        ${myMoney ? `<button class="led-del" title="삭제" onclick="delMoney('${e.id}')">✕</button>` : ''}
      </div>`;
  }
  document.getElementById('ledger').innerHTML = html;
}

let curFit = 'dad';
function setFitMember(k){ curFit = k; renderFit(); scheduleSeen(); }

/* 바퀴·타임·횟수를 시간으로 환산해 소모 열량을 어림한다 */
const minutesOf = (type, amount, f) =>
  amount * (f.unitMin?.[type] ?? actOf(type).minPer);
const kcalOf = (type, amount, kg, f) =>
  Math.round(actOf(type).met * (kg || 60) * (minutesOf(type, amount, f) / 60));
const bmiOf = (kg, cm) => (kg && cm ? Math.round((kg / ((cm / 100) ** 2)) * 10) / 10 : null);
const bmiLabel = b =>
  b === null ? '' : b < 18.5 ? '저체중' : b < 23 ? '정상' : b < 25 ? '과체중' : '비만';

/* 최근 기록순 [날짜, 체중] */
function weightSeries(key){
  return Object.entries(fit[key].w).sort((a, b) => a[0].localeCompare(b[0]));
}

/* 체중 추이 — 한 계열이므로 색은 그 사람 색 하나, 눈금선은 가는 실선 */
function weightChart(key, color){
  const all = weightSeries(key);
  const pts = all.slice(-30);
  if (pts.length < 2)
    return `<p class="fit-hint">체중을 두 번 이상 기록하면 변화 그래프가 나와요</p>`;

  const W = 300, H = 96, L = 30, R = 8, T = 10, B = 20;
  const xs = pts.map(p => Date.parse(p[0]));
  const ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(0.4, (hi - lo) * 0.25);
  const yLo = lo - pad, yHi = hi + pad;
  const px = t => L + (x1 === x0 ? (W - L - R) : (t - x0) / (x1 - x0) * (W - L - R));
  const py = v => T + (yHi - v) / (yHi - yLo) * (H - T - B);

  const grid = [yHi, (yHi + yLo) / 2, yLo].map(v => `
    <line x1="${L}" y1="${py(v).toFixed(1)}" x2="${W - R}" y2="${py(v).toFixed(1)}" class="g-line"/>
    <text x="${L - 6}" y="${(py(v) + 3.5).toFixed(1)}" class="g-tick">${v.toFixed(1)}</text>`).join('');

  const d = pts.map((p, i) =>
    `${i ? 'L' : 'M'}${px(Date.parse(p[0])).toFixed(1)},${py(p[1]).toFixed(1)}`).join(' ');

  const last = pts[pts.length - 1];
  const lx = px(Date.parse(last[0])), ly = py(last[1]);
  const dateShort = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;

  /* 값을 점마다 적지 않는다. 마지막 값만 직접 표시하고 나머지는 눌러서 본다 */
  const hits = pts.map(p => `
    <circle cx="${px(Date.parse(p[0])).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="13" class="g-hit">
      <title>${dateShort(p[0])} · ${p[1].toFixed(1)}kg</title>
    </circle>`).join('');

  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="최근 체중 변화 ${pts.length}회 기록, 마지막 ${last[1].toFixed(1)}킬로그램">
      ${grid}
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="${color}"
        stroke="var(--card)" stroke-width="2"/>
      <text x="${Math.min(lx, W - R - 20).toFixed(1)}" y="${Math.max(T + 4, ly - 9).toFixed(1)}"
        class="g-label" fill="${color}">${last[1].toFixed(1)}</text>
      <text x="${L}" y="${H - 5}" class="g-tick" text-anchor="start">${dateShort(pts[0][0])}</text>
      <text x="${W - R}" y="${H - 5}" class="g-tick" text-anchor="end">${dateShort(last[0])}</text>
      ${hits}
    </svg>`;
}

/* 이번 주 월~일, 종목별 합계 */
function weekOf(key, type){
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  return DAYS.map((d, i) => {
    const day = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const date = ymdOf(day);
    const min = fit[key].ex
      .filter(e => e.date === date && e.type === type)
      .reduce((s, e) => s + e.amount, 0);
    return { date, short: d.short, min, today: date === ymdOf(now) };
  });
}

/* 주간 막대 — 막대 끝은 둥글게, 막대 사이는 표면색 간격 */
function weekBars(days, color, unit){
  const W = 300, H = 72, T = 8, B = 18;
  const top = Math.max(1, ...days.map(d => d.min));
  const slot = W / 7, bw = slot - 10;
  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="이번 주 요일별 ${unit}">
      <line x1="0" y1="${H - B}" x2="${W}" y2="${H - B}" class="g-line"/>
      ${days.map((d, i) => {
        const h = d.min ? Math.max(4, (d.min / top) * (H - T - B)) : 0;
        const x = i * slot + 5, y = H - B - h;
        return `
          ${h ? `<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}"
                   rx="4" fill="${color}" opacity="${d.today ? 1 : .55}"/>` : ''}
          <rect x="${i * slot}" y="0" width="${slot}" height="${H}" fill="transparent">
            <title>${d.short}요일 · ${d.min.toLocaleString('ko-KR')}${unit}</title>
          </rect>
          <text x="${(i * slot + slot / 2).toFixed(1)}" y="${H - 6}"
            class="g-tick ${d.today ? 'now' : ''}" text-anchor="middle">${d.short}</text>`;
      }).join('')}
    </svg>`;
}

function renderFit(){
  const m = memberOf(curFit);
  const f = fit[curFit];
  const today = ymdOf(new Date());

  document.getElementById('fitTabs').innerHTML = MEMBERS.map(x =>
    `<button class="${x.key === curFit ? 'on' : ''}" style="--c:${x.color}"
       onclick="setFitMember('${x.key}')">${x.name}${newChip(`fit:${x.key}`)}</button>`).join('');

  /* ── 체중 ── */
  const series = weightSeries(curFit);
  const cur = series.length ? series[series.length - 1][1] : null;
  const prev = series.length > 1 ? series[series.length - 2][1] : null;
  const diff = cur !== null && prev !== null ? Math.round((cur - prev) * 10) / 10 : null;
  const bmi = bmiOf(cur, f.height);
  const toGoal = cur !== null && f.goalW !== null ? Math.round((cur - f.goalW) * 10) / 10 : null;

  const facts = [
    bmi !== null ? `체질량지수 ${bmi} · ${bmiLabel(bmi)}` : '키를 넣으면 체질량지수가 나와요',
    toGoal !== null
      ? (Math.abs(toGoal) < 0.05 ? '목표 달성!' : `목표까지 ${Math.abs(toGoal).toFixed(1)}kg`)
      : '목표 체중을 정해보세요',
  ].join(' · ');

  /* 자기 운동 기록만 고칠 수 있다 (아빠는 관리자라 모두 고칠 수 있다) */
  const myFit = LOCK.canEdit(curFit);
  const fro = myFit ? '' : 'disabled';

  document.getElementById('fitWeight').innerHTML = `
    <div class="fit-head">
      <h2>체중${myFit ? '' : ` <span class="ro-mark" title="${m.name}만 고칠 수 있어요">🔒</span>`}</h2>
      <button class="btn" onclick="openFitSetup()" ${fro}>⚙ 키·목표</button>
    </div>
    <div class="fit-hero" style="--c:${m.color}">
      <b>${cur !== null ? cur.toFixed(1) : '—'}</b><span class="unit">kg</span>
      ${diff !== null && diff !== 0
        ? `<span class="delta ${diff < 0 ? 'down' : 'up'}">${diff < 0 ? '▼' : '▲'} ${Math.abs(diff).toFixed(1)}</span>`
        : ''}
    </div>
    <div class="fit-facts">${facts}</div>
    ${weightChart(curFit, m.color)}
    <div class="fit-form">
      <input type="number" id="wInput" step="0.1" min="5" max="300" inputmode="decimal" ${fro}
        placeholder="오늘 체중" value="${f.w[today] ?? ''}" aria-label="오늘 체중">
      <button class="btn primary" onclick="saveWeight()" ${fro}>기록</button>
    </div>`;

  /* ── 운동 ── 종목마다 단위가 달라 따로 보여준다 (한 그래프에 섞지 않는다) */
  const todayList = f.ex.filter(e => e.date === today)
    .sort((a, b) => b.id.localeCompare(a.id));
  const kcalToday = todayList.reduce((s, e) => s + kcalOf(e.type, e.amount, cur, f), 0);

  const mine = actsOf(curFit);
  const blocks = mine.map(a => {
    const days = weekOf(curFit, a.k);
    const total = days.reduce((s, d) => s + d.min, 0);
    const goal = f.goals?.[a.k] || 0;
    const rate = goal ? Math.min(100, Math.round(total / goal * 100)) : 0;
    return `
      <div class="act">
        <div class="act-head">
          <span class="em">${a.e}</span>
          <b>${a.n}</b>
          <span class="act-goal">${goal ? `목표 ${goal.toLocaleString('ko-KR')}${a.unit}` : '목표 없음'}</span>
        </div>
        <div class="fit-hero" style="--c:${m.color}">
          <b>${total.toLocaleString('ko-KR')}</b><span class="unit">${a.unit}</span>
          ${goal ? `<span class="delta ${rate >= 100 ? 'down' : ''}">${rate}%</span>` : ''}
        </div>
        ${goal ? `<div class="bar"><i style="width:${rate}%;background:${m.color}"></i></div>` : ''}
        ${weekBars(days, m.color, a.unit)}
      </div>`;
  }).join('');

  document.getElementById('fitExercise').innerHTML = `
    <div class="fit-head">
      <h2>이번 주 운동</h2>
      <button class="btn" onclick="openFitSetup()" ${fro}>⚙ 목표</button>
    </div>
    ${blocks}
    ${hasSober(curFit) ? soberBlock(curFit, m.color, myFit) : ''}
    <div class="fit-form ex">
      ${mine.length > 1
        ? `<select id="exType" onchange="syncExUnit()" ${fro}>${mine.map(x =>
             `<option value="${x.k}">${x.e} ${x.n}</option>`).join('')}</select>`
        : `<span class="only-act">${mine[0].e} ${mine[0].n}</span>
           <input type="hidden" id="exType" value="${mine[0].k}">`}
      <input type="number" id="exAmt" min="1" max="100000" step="1" inputmode="numeric" ${fro}
        placeholder="${mine[0].unit}" aria-label="운동량">
      <button class="btn primary" onclick="addExercise()" ${fro}>기록</button>
    </div>
    <div class="fit-list">
      ${todayList.length
        ? `<div class="fit-list-head">오늘 ${todayList.length}건 · 약 ${kcalToday}kcal</div>` +
          todayList.map(e => {
            const x = actOf(e.type);
            return `<div class="fit-row">
                <span class="em">${x.e}</span>
                <b>${x.n}</b>
                <small>${e.amount.toLocaleString('ko-KR')}${x.unit} · ${kcalOf(e.type, e.amount, cur, f)}kcal</small>
                ${myFit ? `<button class="x" title="삭제" onclick="delExercise('${e.id}')">✕</button>` : ''}
              </div>`;
          }).join('')
        : `<p class="fit-hint">오늘은 아직 기록이 없어요</p>`}
    </div>`;
  syncExUnit();
}

/* 이번 주 금주 현황 — 하루에 한 번, 성공 여부만 남긴다 */
function soberWeek(key){
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  return DAYS.map((d, i) => {
    const day = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const date = ymdOf(day);
    return { date, short: d.short, done: !!fit[key].sober[date],
             today: date === ymdOf(now), future: day > now };
  });
}

function soberBlock(key, color, mayEdit){
  const f = fit[key];
  const days = soberWeek(key);
  const done = days.filter(d => d.done).length;
  const goal = f.goals?.sober || 0;
  const rate = goal ? Math.min(100, Math.round(done / goal * 100)) : 0;
  const todayDone = !!f.sober[ymdOf(new Date())];

  return `
    <div class="act">
      <div class="act-head">
        <span class="em">🚭</span>
        <b>금주</b>
        <span class="act-goal">${goal ? `목표 주 ${goal}일` : '목표 없음'}</span>
      </div>
      <div class="fit-hero" style="--c:${color}">
        <b>${done}</b><span class="unit">일</span>
        ${goal ? `<span class="delta ${rate >= 100 ? 'down' : ''}">${rate}%</span>` : ''}
      </div>
      ${goal ? `<div class="bar"><i style="width:${rate}%;background:${color}"></i></div>` : ''}
      <div class="sober-week">
        ${days.map(d => `
          <span class="s-day ${d.done ? 'on' : ''} ${d.today ? 'now' : ''} ${d.future ? 'later' : ''}"
            style="--c:${color}" title="${d.short}요일 ${d.done ? '성공' : '기록 없음'}">
            <i>${d.done ? '✓' : '·'}</i>${d.short}
          </span>`).join('')}
      </div>
      <button type="button" class="btn sober-btn ${todayDone ? 'primary' : ''}"
        onclick="toggleSober()" ${mayEdit ? '' : 'disabled'}>
        ${todayDone ? '✓ 오늘 금주 성공' : '오늘 금주 성공 체크'}
      </button>
    </div>`;
}

function toggleSober(){
  if (!LOCK.canEdit(curFit)) return;
  const key = ymdOf(new Date());
  if (fit[curFit].sober[key]) delete fit[curFit].sober[key];
  else fit[curFit].sober[key] = true;
  saveFit();
  renderFit();
}

/* 고른 종목에 맞춰 입력칸 단위를 바꾼다 */
function syncExUnit(){
  const sel = document.getElementById('exType');
  const inp = document.getElementById('exAmt');
  if (!sel || !inp) return;
  const a = actOf(sel.value);
  inp.placeholder = a.unit;

function saveWeight(){
  if (!LOCK.canEdit(curFit)) return;
  const el = document.getElementById('wInput');
  const kg = Math.round(Number(el.value) * 10) / 10;
  if (!Number.isFinite(kg) || kg < 5 || kg > 300){
    alert('체중을 숫자로 적어주세요.');
    el.focus();
    return;
  }
  fit[curFit].w[ymdOf(new Date())] = kg;
  saveFit();
  renderFit();
}

function addExercise(){
  if (!LOCK.canEdit(curFit)) return;
  const el = document.getElementById('exAmt');
  const type = document.getElementById('exType').value;
  const a = actOf(type);
  const amount = Math.round(Number(el.value));
  if (!Number.isFinite(amount) || amount <= 0 || amount > 100000){
    alert(`${a.n}을(를) 몇 ${a.unit} 했는지 적어주세요.`);
    el.focus();
    return;
  }
  fit[curFit].ex.push({
    id: Math.random().toString(36).slice(2),
    date: ymdOf(new Date()),
    type, amount,
  });
  saveFit();
  renderFit();
}

function delExercise(id){
  if (!LOCK.canEdit(curFit)) return;
  fit[curFit].ex = fit[curFit].ex.filter(e => e.id !== id);
  saveFit();
  renderFit();
}

  if (!LOCK.canEdit(curFit)) return;
  const f = fit[curFit];
  document.getElementById('fitSetupTitle').textContent = `${memberOf(curFit).name} 설정`;
  document.getElementById('fHeight').value = f.height ?? '';
  document.getElementById('fGoalW').value = f.goalW ?? '';

  /* 목표 칸은 그 사람이 하는 종목에 맞춰 만든다 */

        inputmode="numeric" value="${f.goals?.[a.k] ?? a.goal}">

    </label>`}`).join('')

    </label>` : '');

  document.getElementById('fitSetupDlg').showModal();

function saveFitSetup(){
  if (!LOCK.canEdit(curFit)) return;
  const pick = (id, lo, hi) => {
    const n = Number(document.getElementById(id).value);
    return Number.isFinite(n) && n >= lo && n <= hi ? n : null;
  };
  const f = fit[curFit];
  f.height = pick('fHeight', 80, 230);
  f.goalW  = pick('fGoalW', 10, 300);
  for (const a of actsOf(curFit)){
    f.goals[a.k] = pick(`g_${a.k}`, 0, 100000) ?? a.goal;
    if (!a.fixed) f.unitMin[a.k] = pick(`u_${a.k}`, 0.1, 240) ?? a.minPer;
  }
  if (hasSober(curFit)) f.goals.sober = pick('g_sober', 0, 7) ?? 5;
  saveFit();
  document.getElementById('fitSetupDlg').close();
  renderFit();
}

function setTime(mKey, dKey, field, value){

}

/* 주간 설정에서도 오늘 화면처럼 편한 대로 쳐서 넣는다 */
function setWeekTime(mKey, dKey, field, raw, el){
  if (!LOCK.canEdit(mKey)) return;
  const v = parseTime(raw);
  if (v === null){
    el.value = data[mKey][dKey][field] || '';
    el.classList.add('bad');
    setTimeout(() => el.classList.remove('bad'), 900);

  }
  data[mKey][dKey][field] = v;
  el.value = v;
  save();
  renderToday();
}
function toggleFlag(mKey, dKey, field){
  if (!LOCK.canEdit(mKey)) return;
  data[mKey][dKey][field] = !data[mKey][dKey][field];
  save(); renderWeek(); renderToday();
}
function toggleAcademy(mKey, dKey, name){
  if (!LOCK.canEdit(mKey)) return;
  const slot = data[mKey][dKey];
  const set = new Set(slot.academies);
  if (set.has(name)) set.delete(name); else set.add(name);
  slot.academies = acadList(mKey).filter(a => set.has(a));   // 항상 같은 순서로 정렬
  save(); renderWeek(); renderToday();
}
function fillWeekdays(mKey){
  if (!LOCK.canEdit(mKey)) return;
  const src = data[mKey].mon;
  for (const d of WEEKDAYS) data[mKey][d] = copySlot(src);
  save(); renderWeek(); renderToday();
}
function clearMember(mKey){
  if (!LOCK.canEdit(mKey)) return;
  for (const d of DAYS) data[mKey][d.key] = blankSlot();
  save(); renderWeek(); renderToday();
}

/* ---------- 백업 / 초기화 ---------- */
function exportJson(){
  const payload = { version:11, weekly:data, events, money, moods, says, fit, quiz, plan, traced,
                    codes, notice };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `가족스케줄_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
/* 백업 파일에 무엇이 들어 있는지 한 줄로 요약 — 파일을 잘못 고르지 않도록 */
function summarize(parsed){
  const w = mergeWeekly(parsed?.weekly || parsed);
  const times = MEMBERS.reduce((n, m) =>
    n + DAYS.filter(d => w[m.key][d.key].go || w[m.key][d.key].back).length, 0);
  const ev = Object.values(cleanEvents(parsed?.events)).reduce((n, l) => n + l.length, 0);
  const mn = Object.values(cleanMoney(parsed?.money)).reduce((n, l) => n + l.length, 0);
  return `시간표 ${times}칸 · 특별 일정 ${ev}건 · 용돈 기록 ${mn}건`;
}

/* 불러오기·초기화는 온 가족 자료를 통째로 갈아엎으므로 관리자(아빠)만 할 수 있다 */
function importJson(input){
  if (!LOCK.isAdmin()){
    input.value = '';
    alert('백업 불러오기는 아빠만 할 수 있어요.');
    return;
  }
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      askImport(parsed, file.name);
    }catch(e){
      alert('파일을 읽을 수 없습니다. 백업 파일이 맞는지 확인해 주세요.');
    }
  };
  reader.readAsText(file);
  input.value = '';

/* ---------- 탭 ---------- */
const TAB_ORDER = ['today', 'month', 'fit', 'money', 'week'];
let curTab = 'today';

/* 좌우로 밀어 탭을 넘긴다. 사진첩을 넘기는 것과 같은 방향이다.
   손가락을 왼쪽으로 끌면 오른쪽 탭(다음)이 오고,
   오른쪽으로 끌면 왼쪽 탭(이전)이 온다. 양 끝은 서로 이어져 있다.
     주간 설정에서 손가락을 왼쪽으로 끌면 오늘
     오늘에서 손가락을 오른쪽으로 끌면 주간 설정 */
(function setupSwipe(){
  let x0 = 0, y0 = 0, live = false, swiped = false;
  let scroller = null, scrollAt = 0;

  document.addEventListener('touchstart', e => {
    live = false;
    scroller = null;
    if (e.touches.length !== 1) return;
    if (document.documentElement.classList.contains('locked')) return;
    if (e.target.closest && e.target.closest('dialog')) return;
    /* 지금 편집 중인 칸 위에서 끄는 것은 글자 선택이므로 건드리지 않는다 */
    const a = document.activeElement;
    if (a === e.target && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;

    /* 주간 설정 표는 화면 전체를 덮고 있어 통째로 제외하면 스와이프가 아예 안 된다.
       실제로 표가 좌우로 움직였는지 나중에 확인해서 판단한다. */
    const sc = e.target.closest && e.target.closest('.table-scroll');
    if (sc && sc.scrollWidth > sc.clientWidth + 1){
      scroller = sc;
      scrollAt = sc.scrollLeft;
    }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    live = true;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!live) return;
    live = false;
    if (scroller && scroller.scrollLeft !== scrollAt) return;  // 표를 좌우로 본 것
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) < 55) return;                 // 너무 짧으면 무시
    if (Math.abs(dx) < Math.abs(dy) * 1.3) return; // 세로로 움직였으면 무시
    const i = TAB_ORDER.indexOf(curTab);
    const step = dx < 0 ? 1 : -1;      // 왼쪽으로 끌면 다음 탭
    showTab(TAB_ORDER[(i + step + TAB_ORDER.length) % TAB_ORDER.length], step);
    swiped = true;
    setTimeout(() => { swiped = false; }, 300);
  }, { passive: true });

  /* 민 자리에 있던 버튼이나 입력칸이 따라 눌리지 않게 막는다 */
  document.addEventListener('click', e => {
    if (!swiped) return;
    swiped = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
})();

const panelId = t => 'panel' + t[0].toUpperCase() + t.slice(1);
let leaveTimer = null;

/* dir 을 주면 그 방향으로 넘어간다. 안 주면 탭 순서로 알아서 정한다.
   나가는 화면은 한쪽으로 밀려나가고 새 화면이 반대쪽에서 들어온다. */
function showTab(which, dir){
  if (dir === undefined){
    const from = TAB_ORDER.indexOf(curTab), to = TAB_ORDER.indexOf(which);
    dir = to >= from ? 1 : -1;
  }
  const panel = document.getElementById(panelId(which));
  const prev = document.getElementById(panelId(curTab));

  /* 빠르게 여러 번 넘길 때 이전 잔상이 남지 않게 먼저 정리한다 */
  clearTimeout(leaveTimer);
  for (const p of document.querySelectorAll('.panel.leaving')){
    p.classList.remove('leaving');
    p.style.removeProperty('--slide');
  }

  if (prev && prev !== panel){
    prev.style.setProperty('--slide', (dir > 0 ? -100 : 100) + '%');
    prev.classList.add('leaving');
    leaveTimer = setTimeout(() => {
      prev.classList.remove('leaving');
      prev.style.removeProperty('--slide');
    }, 280);
  }
  panel.style.setProperty('--slide', (dir > 0 ? 100 : -100) + '%');

  curTab = which;
  for (const t of TAB_ORDER){
    const on = t === which;
    document.getElementById('panel' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', on);
    document.getElementById('tab'   + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', on);
  }
  renderTabDots();
  scheduleSeen();
}

/* 탭 이름 옆에 빨간 점 — 그 화면 어딘가에 새 소식이 있다는 뜻 */
function renderTabDots(){
  for (const t of TAB_ORDER)
    document.getElementById('tab' + t[0].toUpperCase() + t.slice(1))

/* 화면을 잠깐 들여다보면 그 자리의 NEW 표시를 지운다.
   공지는 어느 탭에서나 늘 보이므로 함께 지운다.
   보고 있는 도중에 새로 뜬 것은 눈에 띄도록 조금 더 오래 남긴다. */
let seenTimer = null;
function scheduleSeen(ms = 1500){
  clearTimeout(seenTimer);
  if (document.documentElement.classList.contains('locked')) return;
  if (document.hidden) return;                 // 다른 화면을 보고 있으면 읽은 게 아니다
  seenTimer = setTimeout(() => {
    if (document.hidden) return;
    /* 운동·용돈은 지금 보고 있는 사람 것만 읽은 것으로 친다 */
    const here = curTab === 'fit'   ? `fit:${curFit}`
               : curTab === 'money' ? `money:${curKid}`
               : curTab;
    clearNew(['notice', here]);
  }, ms);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) scheduleSeen(4000);
});

const splashDone = (function setupSplash(){
  const el = document.getElementById('splash');
  if (!el) return Promise.resolve();
  const img = document.getElementById('splashImg');
  return new Promise(resolve => {
    let alive = true;
    const finish = fade => {
      if (!alive) return;
      alive = false;
      if (!fade){ el.remove(); resolve(); return; }
      el.classList.add('out');
      setTimeout(() => { el.remove(); resolve(); }, 400);
    };
    img.addEventListener('error', () => finish(false));   // 사진이 없으면 바로 넘어간다
    setTimeout(() => finish(true), 1150);                 // 화면에 머무는 시간 약 1.5초

})();

   띄우고 그것을 누르면 구글로 나가 버린다. 글자 넣는 칸이 아닌 곳에서는
   고르기와 길게 누르기 메뉴를 아예 막는다. */
(function keepInside(){
  const editable = el => !!(el && el.closest && el.closest('input, textarea, [contenteditable]'));
  document.addEventListener('selectstart', e => { if (!editable(e.target)) e.preventDefault(); });
  document.addEventListener('contextmenu', e => { if (!editable(e.target)) e.preventDefault(); });
  /* 혹시 글자가 골라졌다면 바로 풀어 준다 */
  document.addEventListener('selectionchange', () => {
    if (editable(document.activeElement)) return;
    const s = document.getSelection();
    if (s && !s.isCollapsed) s.removeAllRanges();
  });
})();

  if (nu === now)             return codeSay('지금 쓰는 것과 같아요. 다른 번호로 해주세요.', 'err');

/* ---------- 누가 무엇을 바꿨는지 (NEW 표시 · 알림) ----------
   원격에서 온 내용을 반영하기 직전에 지금 것과 견주어, 달라진 자리를 적어 둔다.

const NEW_KEY = 'family-new-v1';
let newMarks = (function(){
  try{
    const raw = JSON.parse(localStorage.getItem(NEW_KEY));
    if (!raw || typeof raw !== 'object') return {};
    const out = {};
    for (const [spot, v] of Object.entries(raw))
      if (v && typeof v === 'object') out[spot] = { by: String(v.by || ''), at: Number(v.at) || 0 };
    return out;
  }catch(e){ return {}; }
})();
function saveNewMarks(){ try{ localStorage.setItem(NEW_KEY, JSON.stringify(newMarks)); }catch(e){} }

/* 자리마다 어느 탭에 속하는지, 사람이 읽을 이름은 무엇인지 */
function spotTab(spot){
  const head = spot.split(':')[0];
  return { notice:null, today:'today', month:'month', fit:'fit', money:'money', week:'week' }[head] ?? null;
}
function spotName(spot){
  const [head, arg] = spot.split(':');
  const who = arg ? (memberOf(arg)?.name || '') : '';
  if (head === 'notice') return '오늘의 공지사항';
  if (head === 'today')  return `${who}의 오늘 칸`;
  if (head === 'week')   return `${who}의 주간 설정`;
  if (head === 'fit')    return `${who}의 운동 기록`;
  if (head === 'money')  return `${who}의 용돈기입장`;
  if (head === 'month')  return '달력 일정';
  return '';
}

/* 이름 뒤에 붙는 조사 — 받침이 있으면 '이', 없으면 '가' (준이 / 엄마가) */
function withSubject(name){
  const c = name.charCodeAt(name.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return name + '가';
  return name + ((c - 0xac00) % 28 ? '이' : '가');
}

/* 값이 같은지 본다. JSON 글자로 견주면 키 순서만 달라도 다르다고 나오므로
   (mergeWeekly 가 키를 다시 짜면서 순서가 바뀐다) 하나하나 짚어 본다. */
function sameJson(a, b){
  if (a === b) return true;
  if (a == null || b == null) return a == null && b == null;
  if (typeof a !== 'object' || typeof b !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)){
    return a.length === b.length && a.every((v, i) => sameJson(v, b[i]));
  }
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && sameJson(a[k], b[k]));
}

/* 원격 내용과 지금 내용을 견주어 달라진 자리를 모은다 */
/* take 는 그 영역을 실제로 받아들일지 알려준다 — 물리치는 영역은 NEW 표시도 안 붙인다 */
function whatChanged(remote, take = () => true){
  const spots = new Set();
  const today = ymdOf(new Date());
  const has = (area, v) => take(area) && v;

  if (take('notice') && typeof remote.notice === 'string' && remote.notice.slice(0, 500) !== notice)
    spots.add('notice');

  if (has('weekly', remote.weekly)){
    const next = mergeWeekly(remote.weekly);
    for (const m of MEMBERS){
      if (sameJson(next[m.key], data[m.key])) continue;
      spots.add(`week:${m.key}`);
      /* 오늘 요일이 바뀌었다면 오늘 칸에도 표시한다 */
      const dk = DAYS[todayIdx()].key;
      if (!sameJson(next[m.key][dk], data[m.key][dk])) spots.add(`today:${m.key}`);
    }
  }
  if (has('events', remote.events)){
    const next = cleanEvents(remote.events);
    for (const date of new Set([...Object.keys(next), ...Object.keys(events)]))
      if (!sameJson(next[date], events[date])) spots.add(`month:${date}`);
  }
  if (has('money', remote.money)){
    const next = cleanMoney(remote.money);
    for (const k of KIDS) if (!sameJson(next[k.key], money[k.key])) spots.add(`money:${k.key}`);
  }
  if (has('plan', remote.plan)){
    const next = cleanPlan(remote.plan);
    for (const k of KIDS) if (!sameJson(next[k.key], plan[k.key])) spots.add(`money:${k.key}`);
  }
  if (has('traced', remote.traced)){
    const next = cleanTraced(remote.traced);
    /* 따라 쓴 횟수가 달라지면 미션 용돈도 달라진다 */
    const only = (src, key) => Object.fromEntries(
      Object.entries(src).map(([d, v]) => [d, v[key]]).filter(([, v]) => v));
    for (const k of KIDS)
      if (!sameJson(only(next, k.key), only(traced, k.key))) spots.add(`money:${k.key}`);
  }
  if (has('fit', remote.fit)){
    const next = cleanFit(remote.fit);
    for (const m of MEMBERS) if (!sameJson(next[m.key], fit[m.key])) spots.add(`fit:${m.key}`);
  }
  /* 기분·하고싶은 말·시험 점수는 오늘 것만 본다 */
  for (const [key, cur, clean] of [['moods', moods, cleanMoods], ['says', says, cleanSays],
                                   ['quiz', quiz, cleanQuiz]]){
    if (!has(key, remote[key])) continue;
    const next = clean(remote[key]);
    for (const m of MEMBERS)
      if (!sameJson(next[today]?.[m.key], cur[today]?.[m.key])) spots.add(`today:${m.key}`);
  }
  return [...spots];
}

/* 달라진 자리를 적어 두고, 알림이 켜져 있으면 알려준다 */
function markNew(spots, by){
  if (!spots || !spots.length) return;
  const at = Date.now();
  for (const s of spots) newMarks[s] = { by: by || '', at };
  saveNewMarks();
  notifyChange(spots, by);
  scheduleSeen(6000);          // 보고 있는 화면이면 잠시 보여주고 지운다
}

const hasNew = prefix => Object.keys(newMarks)
  .some(s => s === prefix || s.startsWith(prefix + ':'));
const newBy = prefix => {
  const s = Object.keys(newMarks).find(k => k === prefix || k.startsWith(prefix + ':'));
  return s ? (memberOf(newMarks[s].by)?.name || '') : '';
};

/* 화면에 붙일 NEW 딱지 */
function newChip(prefix){
  if (!hasNew(prefix)) return '';
  const who = newBy(prefix);
  return `<span class="new-chip" title="${
    who ? withSubject(who) + ' 바꿨어요' : '새로 바뀌었어요'}">NEW</span>`;
}

/* 그 자리를 봤으면 표시를 지운다 */
function clearNew(prefixes){
  let hit = false;
  for (const p of [].concat(prefixes))
    for (const s of Object.keys(newMarks))
      if (s === p || s.startsWith(p + ':')){ delete newMarks[s]; hit = true; }
  if (hit){ saveNewMarks(); renderAll(); }
  return hit;
}
function clearAllNew(){ newMarks = {}; saveNewMarks(); renderAll(); }

/* ---------- 알림 ---------- */
function notifyState(){
  if (!('Notification' in window)) return 'unsupported';
  return Notification.permission;                       // granted | denied | default
}
async function askNotify(){
  if (!('Notification' in window)){
    alert('이 브라우저는 알림을 지원하지 않아요.');
    return;
  }
  if (Notification.permission === 'denied'){
    alert('브라우저 설정에서 이 사이트의 알림을 막아 두었어요.\n설정에서 알림을 허용해 주세요.');
    return;
  }
  try{ await Notification.requestPermission(); }catch(e){}
  renderNotifyBtn();
  if (Notification.permission === 'granted')
    showNotice('알림 켜짐', '가족이 무언가 바꾸면 알려드릴게요.');
}

function showNotice(title, body){
  if (notifyState() !== 'granted') return;
  const opt = { body, icon: './icon-192.png', badge: './icon-192.png', tag: 'lhk-family' };
  const direct = () => { try{ new Notification(title, opt); }catch(e){} };
  /* 휴대폰에서는 서비스워커를 거쳐야 알림이 뜬다. 다만 서비스워커가 이 화면을
     맡고 있을 때만 그렇게 한다 — 등록 전이라면 ready 가 끝나지 않아 알림이 사라진다. */
  if (navigator.serviceWorker?.controller){
    navigator.serviceWorker.ready
      .then(reg => reg.showNotification(title, opt))
      .catch(direct);
  } else {
    direct();
  }
}

function notifyChange(spots, by){
  const who = memberOf(by)?.name;
  const names = [...new Set(spots.map(spotName).filter(Boolean))];
  if (!names.length) return;
  const what = names.length === 1 ? names[0] : `${names[0]} 외 ${names.length - 1}곳`;
  showNotice(who ? `${withSubject(who)} 바꿨어요` : '가족이 무언가 바꿨어요', what);
}

function renderNotifyBtn(){
  const btn = document.getElementById('notifyBtn');
  if (!btn) return;
  const st = notifyState();
  btn.hidden = st === 'unsupported';
  btn.disabled = st === 'granted';
  btn.textContent = st === 'granted' ? '🔔 알림 켜짐'
                  : st === 'denied'  ? '🔕 알림 막힘'
                  : '🔔 알림 켜기';
  btn.title = st === 'granted' ? '가족이 무언가 바꾸면 알려드려요'
            : st === 'denied'  ? '브라우저 설정에서 알림을 허용해 주세요'
            : '눌러서 알림을 켜세요';
}

/* ---------- 동기화 계층과의 연결 ---------- */
const SYNC_LABEL = {
  local:      ['#9ca3af', '이 기기에만 저장'],
  connecting: ['#f59e0b', '연결 중…'],
  live:       ['#10b981', '실시간 동기화 중'],
  error:      ['#ef4444', '동기화 오류'],
};
function setSyncStatus(state, detail){
  const [color, label] = SYNC_LABEL[state] || SYNC_LABEL.local;
  const el = document.getElementById('syncBadge');
  el.innerHTML = `<i style="background:${color}"></i><span>${label}</span>`;
  el.title = detail ? `${label} — ${detail}` : label;
}

window.familyApp = {
  setSyncStatus,
  /* 원격으로 보낼 전체 스냅샷. by 는 마지막으로 손댄 사람 —
     받는 쪽에서 "엄마가 바꿨어요" 라고 알려주기 위해 함께 보낸다. */
  snapshot: () => ({ weekly: data, events, money, moods, says, fit, quiz, plan, traced,
                     codes, notice, stamps, by: LOCK.who() || '' }),
  /* 원격에서 받은 내용을 로컬에 반영 (되돌려 보내지 않는다).
     영역마다 손댄 시각을 견주어, 내 것이 더 새것이면 옛 내용으로 덮지 않는다.
     그런 영역이 하나라도 있으면 true 를 돌려주어 동기화 계층이 되돌려 보내게 한다. */
  apply(remote){
    if (!remote || typeof remote !== 'object') return false;
    const rs = (remote.stamps && typeof remote.stamps === 'object') ? remote.stamps : null;
    let mineNewer = false;
    const take = area => {
      if (!rs) return true;              // 시각을 안 보내는 옛 판 기기 — 예전처럼 받는다
      const r = Number(rs[area]) || 0, l = Number(stamps[area]) || 0;
      if (r >= l) return true;
      mineNewer = true;                  // 내 것이 더 새것 → 물리치고 되돌려 보낸다
      return false;
    };
    const got = {};
    for (const a of AREAS) got[a] = take(a);
    /* 받아들인 영역은 상대의 시각을 물려받는다 (없는 것은 적어 두지 않는다) */
    const keep = a => {
      if (!rs || !got[a]) return;
      const n = Number(rs[a]) || 0;
      if (n > 0) stamps[a] = n;
    };

    /* 무엇이 달라졌는지 먼저 살펴 두었다가, 반영한 뒤 NEW 표시를 붙인다 */
    const changed = whatChanged(remote, a => got[a]);
    if (got.weekly && remote.weekly) { data   = mergeWeekly(remote.weekly);  put(STORE_KEY,  data);   keep('weekly'); }
    if (got.events && remote.events) { events = cleanEvents(remote.events);  put(EVENTS_KEY, events); keep('events'); }
    if (got.money  && remote.money)  { money  = cleanMoney(remote.money);    put(MONEY_KEY,  money);  keep('money'); }
    if (got.moods  && remote.moods)  { moods  = cleanMoods(remote.moods);    put(MOOD_KEY,   moods);  keep('moods'); }
    if (got.says   && remote.says)   { says   = cleanSays(remote.says);      put(SAYS_KEY,   says);   keep('says'); }
    if (got.fit    && remote.fit)    { fit    = cleanFit(remote.fit);        put(FIT_KEY,    fit);    keep('fit'); }
    if (got.quiz   && remote.quiz)   { quiz   = cleanQuiz(remote.quiz);      put(QUIZ_KEY,   quiz);   keep('quiz'); }
    if (got.plan   && remote.plan)   { plan   = cleanPlan(remote.plan);      put(PLAN_KEY,   plan);   keep('plan'); }
    if (got.traced && remote.traced) { traced = cleanTraced(remote.traced);  put(TRACE_KEY,  traced); keep('traced'); }
    /* 다른 기기에서 바꾼 비밀번호 — 다음에 열 때부터 그 값으로 들어온다 */
    if (got.codes && remote.codes){ LOCK.applyCodes(remote.codes); codes = LOCK.changed(); keep('codes'); }
    if (got.notice && typeof remote.notice === 'string'){
      notice = remote.notice.slice(0, 500);
      try{ localStorage.setItem(NOTICE_KEY, notice); }catch(e){}
      keep('notice');
    }
    try{ localStorage.setItem(STAMP_KEY, JSON.stringify(stamps)); }catch(e){}
    markNew(changed, remote.by);
    renderAll();
    return mineNewer;
  },
  /* 동기화 계층이 자신의 push 함수를 여기에 등록한다 */
  set onChange(fn){ onLocalChange = fn; },
  get onChange(){ return onLocalChange; },
};

setSyncStatus('local');
renderWho();
renderTabDots();
renderNotifyBtn();
renderCodeBtn();
scheduleSeen(5000);      // 앱을 켤 때는 조금 오래 보여준 뒤 지운다
renderNotice();
renderToday();
renderMonth();
renderFit();
renderMoney();
renderWeek();
setInterval(renderToday, 60000);   // 1분마다 상태 갱신

/* 서비스워커 등록 — 안드로이드에서 독립된 앱으로 설치되게 해준다.
   file:// 로 열었거나 지원하지 않는 브라우저면 조용히 넘어간다. */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

<!-- ══════════════════════════════════════════════════════════════════════════
     실시간 동기화 계층
     FIREBASE_CONFIG 가 비어 있으면 아무것도 하지 않고 로컬 전용으로 남는다.
     ══════════════════════════════════════════════════════════════════════════ -->
<script type="module">
const cfg = window.SUPABASE_CONFIG || {};
const app = window.familyApp;
const ROW = cfg.familyId || 'lhk-family';

/* 내가 보낸 변경이 되돌아왔을 때 무시하기 위한 기기 식별자 */
const ME = Math.random().toString(36).slice(2) + Date.now().toString(36);

if (!cfg.url || !cfg.anonKey){
  app.setSyncStatus('local', '동기화 설정이 비어 있습니다');
} else {
  app.setSyncStatus('connecting');
  try{
    const { createClient } =
      await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const sb = createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false } });

    let applying = false;   // 원격 반영 중에는 되돌려 보내지 않는다
    let timer = null;

    async function push(){
      const { error } = await sb.from('family_state').upsert({
        id: ROW,
        data: app.snapshot(),
        writer: ME,
        updated_at: new Date().toISOString(),
      });
      if (error) app.setSyncStatus('error', error.message);
    }

    app.onChange = () => {
      if (applying) return;
      clearTimeout(timer);
      timer = setTimeout(push, 500);   // 연속 입력을 묶어서 한 번에 전송
    };

    function receive(row){
      if (!row || row.writer === ME) return;   // 내가 보낸 것은 무시
      applying = true;
      let mineNewer = false;
      try{ mineNewer = app.apply(row.data); } finally { applying = false; }
      /* 내가 더 새 내용을 들고 있었다면 서버가 뒤처진 것이니 곧바로 올려 맞춘다 */
      if (mineNewer){ clearTimeout(timer); timer = setTimeout(push, 300); }
    }

    /* 서버 내용을 한 번 받아 온다 */
    async function pull(){
      try{
        const { data: r } = await sb
          .from('family_state').select('data, writer').eq('id', ROW).maybeSingle();
        if (r) receive(r);
      }catch(e){}
    }

    /* 첫 로드 — 서버에 내용이 있으면 그것을 따르고, 없으면 이 기기 내용으로 시작 */
    const { data: row, error } = await sb
      .from('family_state').select('data, writer').eq('id', ROW).maybeSingle();
    if (error) throw error;
    if (row){
      applying = true;
      let mineNewer = false;
      try{ mineNewer = app.apply(row.data); } finally { applying = false; }
      if (mineNewer) await push();
    } else {
      await push();
    }

    /* 이후 변경을 실시간으로 수신 */
    sb.channel('family-state')
      .on('postgres_changes',
          { event: '*', schema: 'public', table: 'family_state', filter: `id=eq.${ROW}` },
          payload => receive(payload.new))
      .subscribe(status => {
        if (status === 'SUBSCRIBED'){ app.setSyncStatus('live'); pull(); }
        else if (status === 'CHANNEL_ERROR') app.setSyncStatus('error', '실시간 연결 실패');
        else if (status === 'TIMED_OUT')     app.setSyncStatus('error', '연결 시간 초과');
      });

    /* 화면을 다시 켜거나 인터넷이 돌아오면 그동안 놓친 내용을 받아 온다.
       휴대폰이 잠든 사이 실시간 연결이 끊겨 내용이 뒤처지는 것을 막는다. */
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
    window.addEventListener('online', pull);
    window.addEventListener('focus', pull);

  }catch(e){
    app.setSyncStatus('error', e.message || String(e));
  }
}
</script>
