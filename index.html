  document.getElementById('fitTabs').innerHTML = MEMBERS.map(x =>
    `<button class="${x.key === curFit ? 'on' : ''}" style="--c:${x.color}"
       onclick="setFitMember('${x.key}')">${x.name}</button>`).join('');

  /* ── 체중 ── */
  const series = weightSeries(curFit);
  const cur = series.length ? series[series.length - 1][1] : null;
  const prev = series.length > 1 ? series[series.length - 2][1] : null;
  const diff = cur !== null && prev !== null ? Math.round((cur - prev) * 10) / 10 : null;
  const bmi = bmiOf(cur, f.height);
  const toGoal = cur !== null && f.goalW !== null ? Math.round((cur - f.goalW) * 10) / 10 : null;

  const facts = [
    bmi !== null ? `체질량지수 ${bmi} · ${bmiLabel(bmi)}` : '키를 넣으면 체질량지수가 나와요',
    toGoal !== null
      ? (Math.abs(toGoal) < 0.05 ? '목표 달성!' : `목표까지 ${Math.abs(toGoal).toFixed(1)}kg`)
      : '목표 체중을 정해보세요',
  ].join(' · ');

  document.getElementById('fitWeight').innerHTML = `
    <div class="fit-head">
      <h2>체중</h2>
      <button class="btn" onclick="openFitSetup()">⚙ 키·목표</button>
    </div>
    <div class="fit-hero" style="--c:${m.color}">
      <b>${cur !== null ? cur.toFixed(1) : '—'}</b><span class="unit">kg</span>
      ${diff !== null && diff !== 0
        ? `<span class="delta ${diff < 0 ? 'down' : 'up'}">${diff < 0 ? '▼' : '▲'} ${Math.abs(diff).toFixed(1)}</span>`
        : ''}
    </div>
    <div class="fit-facts">${facts}</div>
    ${weightChart(curFit, m.color)}
    <div class="fit-form">
      <input type="number" id="wInput" step="0.1" min="5" max="300" inputmode="decimal"
        placeholder="오늘 체중" value="${f.w[today] ?? ''}" aria-label="오늘 체중">
      <button class="btn primary" onclick="saveWeight()">기록</button>
    </div>`;

  /* ── 운동 ── 종목마다 단위가 달라 따로 보여준다 (한 그래프에 섞지 않는다) */
  const todayList = f.ex.filter(e => e.date === today)
    .sort((a, b) => b.id.localeCompare(a.id));
  const kcalToday = todayList.reduce((s, e) => s + kcalOf(e.type, e.amount, cur, f), 0);

  const mine = actsOf(curFit);
  const blocks = mine.map(a => {
    const days = weekOf(curFit, a.k);
    const total = days.reduce((s, d) => s + d.min, 0);
    const goal = f.goals?.[a.k] || 0;
    const rate = goal ? Math.min(100, Math.round(total / goal * 100)) : 0;
    return `
      <div class="act">
        <div class="act-head">
          <span class="em">${a.e}</span>
          <b>${a.n}</b>
          <span class="act-goal">${goal ? `목표 ${goal.toLocaleString('ko-KR')}${a.unit}` : '목표 없음'}</span>
        </div>
        <div class="fit-hero" style="--c:${m.color}">
          <b>${total.toLocaleString('ko-KR')}</b><span class="unit">${a.unit}</span>
          ${goal ? `<span class="delta ${rate >= 100 ? 'down' : ''}">${rate}%</span>` : ''}
        </div>
        ${goal ? `<div class="bar"><i style="width:${rate}%;background:${m.color}"></i></div>` : ''}
        ${weekBars(days, m.color, a.unit)}
      </div>`;
  }).join('');

  document.getElementById('fitExercise').innerHTML = `
    <div class="fit-head">
      <h2>이번 주 운동</h2>
      <button class="btn" onclick="openFitSetup()">⚙ 목표</button>
    </div>
    ${blocks}
    ${hasSober(curFit) ? soberBlock(curFit, m.color) : ''}
    <div class="fit-form ex">
      ${mine.length > 1
        ? `<select id="exType" onchange="syncExUnit()">${mine.map(x =>
             `<option value="${x.k}">${x.e} ${x.n}</option>`).join('')}</select>`
        : `<span class="only-act">${mine[0].e} ${mine[0].n}</span>
           <input type="hidden" id="exType" value="${mine[0].k}">`}
      <input type="number" id="exAmt" min="1" max="100000" step="1" inputmode="numeric"
        placeholder="${mine[0].unit}" aria-label="운동량">
      <button class="btn primary" onclick="addExercise()">기록</button>
    </div>
    <div class="fit-list">
      ${todayList.length
        ? `<div class="fit-list-head">오늘 ${todayList.length}건 · 약 ${kcalToday}kcal</div>` +
          todayList.map(e => {
            const x = actOf(e.type);
            return `<div class="fit-row">
                <span class="em">${x.e}</span>
                <b>${x.n}</b>
                <small>${e.amount.toLocaleString('ko-KR')}${x.unit} · ${kcalOf(e.type, e.amount, cur, f)}kcal</small>
                <button class="x" title="삭제" onclick="delExercise('${e.id}')">✕</button>
              </div>`;
          }).join('')
        : `<p class="fit-hint">오늘은 아직 기록이 없어요</p>`}
    </div>`;
  syncExUnit();
}

/* 이번 주 금주 현황 — 하루에 한 번, 성공 여부만 남긴다 */
function soberWeek(key){
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  return DAYS.map((d, i) => {
    const day = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const date = ymdOf(day);
    return { date, short: d.short, done: !!fit[key].sober[date],
             today: date === ymdOf(now), future: day > now };
  });
}

function soberBlock(key, color){
  const f = fit[key];
  const days = soberWeek(key);
  const done = days.filter(d => d.done).length;
  const goal = f.goals?.sober || 0;
  const rate = goal ? Math.min(100, Math.round(done / goal * 100)) : 0;
  const todayDone = !!f.sober[ymdOf(new Date())];

  return `
    <div class="act">
      <div class="act-head">
        <span class="em">🚭</span>
        <b>금주</b>
        <span class="act-goal">${goal ? `목표 주 ${goal}일` : '목표 없음'}</span>
      </div>
      <div class="fit-hero" style="--c:${color}">
        <b>${done}</b><span class="unit">일</span>
        ${goal ? `<span class="delta ${rate >= 100 ? 'down' : ''}">${rate}%</span>` : ''}
      </div>
      ${goal ? `<div class="bar"><i style="width:${rate}%;background:${color}"></i></div>` : ''}
      <div class="sober-week">
        ${days.map(d => `
          <span class="s-day ${d.done ? 'on' : ''} ${d.today ? 'now' : ''} ${d.future ? 'later' : ''}"
            style="--c:${color}" title="${d.short}요일 ${d.done ? '성공' : '기록 없음'}">
            <i>${d.done ? '✓' : '·'}</i>${d.short}
          </span>`).join('')}
      </div>
      <button type="button" class="btn sober-btn ${todayDone ? 'primary' : ''}"
        onclick="toggleSober()">
        ${todayDone ? '✓ 오늘 금주 성공' : '오늘 금주 성공 체크'}
      </button>
    </div>`;
}

function toggleSober(){
  const key = ymdOf(new Date());
  if (fit[curFit].sober[key]) delete fit[curFit].sober[key];
  else fit[curFit].sober[key] = true;
  saveFit();
  renderFit();
}

/* 고른 종목에 맞춰 입력칸 단위를 바꾼다 */
function syncExUnit(){
  const sel = document.getElementById('exType');
  const inp = document.getElementById('exAmt');
  if (!sel || !inp) return;
  const a = actOf(sel.value);
  inp.placeholder = a.unit;
  inp.step = a.step;
}

function saveWeight(){
  const el = document.getElementById('wInput');
  const kg = Math.round(Number(el.value) * 10) / 10;
  if (!Number.isFinite(kg) || kg < 5 || kg > 300){
    alert('체중을 숫자로 적어주세요.');
    el.focus();
    return;
  }
  fit[curFit].w[ymdOf(new Date())] = kg;
  saveFit();
  renderFit();
}

function addExercise(){
  const el = document.getElementById('exAmt');
  const type = document.getElementById('exType').value;
  const a = actOf(type);
  const amount = Math.round(Number(el.value));
  if (!Number.isFinite(amount) || amount <= 0 || amount > 100000){
    alert(`${a.n}을(를) 몇 ${a.unit} 했는지 적어주세요.`);
    el.focus();
    return;
  }
  fit[curFit].ex.push({
    id: Math.random().toString(36).slice(2),
    date: ymdOf(new Date()),
    type, amount,
  });
  saveFit();
  renderFit();
}

function delExercise(id){
  fit[curFit].ex = fit[curFit].ex.filter(e => e.id !== id);
  saveFit();
  renderFit();
}

function openFitSetup(){
  const f = fit[curFit];
  document.getElementById('fitSetupTitle').textContent = `${memberOf(curFit).name} 설정`;
  document.getElementById('fHeight').value = f.height ?? '';
  document.getElementById('fGoalW').value = f.goalW ?? '';

  /* 목표 칸은 그 사람이 하는 종목에 맞춰 만든다 */
  document.getElementById('fitGoals').innerHTML = actsOf(curFit).map(a => `
    <label>주간 목표 — ${a.e} ${a.n} (${a.unit})
      <input type="number" id="g_${a.k}" min="0" max="100000" step="${a.step}"
        inputmode="numeric" value="${f.goals?.[a.k] ?? a.goal}">
    </label>
    ${a.fixed ? '' : `
    <label>${a.n} 한 ${a.unit}에 걸리는 시간 (분)
      <input type="number" id="u_${a.k}" min="0.1" max="240" step="0.5"
        inputmode="decimal" value="${f.unitMin?.[a.k] ?? a.minPer}">
    </label>`}`).join('')
    + (hasSober(curFit) ? `
    <label>주간 목표 — 🚭 금주 (일)
      <input type="number" id="g_sober" min="0" max="7" step="1"
        inputmode="numeric" value="${f.goals?.sober ?? 5}">
    </label>` : '');

  document.getElementById('fitSetupDlg').showModal();
}

function saveFitSetup(){
  const pick = (id, lo, hi) => {
    const n = Number(document.getElementById(id).value);
    return Number.isFinite(n) && n >= lo && n <= hi ? n : null;
  };
  const f = fit[curFit];
  f.height = pick('fHeight', 80, 230);
  f.goalW  = pick('fGoalW', 10, 300);
  for (const a of actsOf(curFit)){
    f.goals[a.k] = pick(`g_${a.k}`, 0, 100000) ?? a.goal;
    if (!a.fixed) f.unitMin[a.k] = pick(`u_${a.k}`, 0.1, 240) ?? a.minPer;
  }
  if (hasSober(curFit)) f.goals.sober = pick('g_sober', 0, 7) ?? 5;
  saveFit();
  document.getElementById('fitSetupDlg').close();
  renderFit();
}

function setTime(mKey, dKey, field, value){
  data[mKey][dKey][field] = value;
  save();
  renderToday();
}

/* 주간 설정에서도 오늘 화면처럼 편한 대로 쳐서 넣는다 */
function setWeekTime(mKey, dKey, field, raw, el){
  const v = parseTime(raw);
  if (v === null){
    el.value = data[mKey][dKey][field] || '';
    el.classList.add('bad');
    setTimeout(() => el.classList.remove('bad'), 900);
    return;
  }
  data[mKey][dKey][field] = v;
  el.value = v;
  save();
  renderToday();
}
function toggleFlag(mKey, dKey, field){
  data[mKey][dKey][field] = !data[mKey][dKey][field];
  save(); renderWeek(); renderToday();
}
function toggleAcademy(mKey, dKey, name){
  const slot = data[mKey][dKey];
  const set = new Set(slot.academies);
  if (set.has(name)) set.delete(name); else set.add(name);
  slot.academies = acadList(mKey).filter(a => set.has(a));   // 항상 같은 순서로 정렬
  save(); renderWeek(); renderToday();
}
function fillWeekdays(mKey){
  const src = data[mKey].mon;
  for (const d of WEEKDAYS) data[mKey][d] = copySlot(src);
  save(); renderWeek(); renderToday();
}
function clearMember(mKey){
  for (const d of DAYS) data[mKey][d.key] = blankSlot();
  save(); renderWeek(); renderToday();
}

/* ---------- 백업 / 초기화 ---------- */
function exportJson(){
  const payload = { version:7, weekly:data, events, money, moods, says, fit, notice };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `가족스케줄_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
/* 백업 파일에 무엇이 들어 있는지 한 줄로 요약 — 파일을 잘못 고르지 않도록 */
function summarize(parsed){
  const w = mergeWeekly(parsed?.weekly || parsed);
  const times = MEMBERS.reduce((n, m) =>
    n + DAYS.filter(d => w[m.key][d.key].go || w[m.key][d.key].back).length, 0);
  const ev = Object.values(cleanEvents(parsed?.events)).reduce((n, l) => n + l.length, 0);
  const mn = Object.values(cleanMoney(parsed?.money)).reduce((n, l) => n + l.length, 0);
  return `시간표 ${times}칸 · 특별 일정 ${ev}건 · 용돈 기록 ${mn}건`;
}

function importJson(input){
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      askImport(parsed, file.name);
    }catch(e){
      alert('파일을 읽을 수 없습니다. 백업 파일이 맞는지 확인해 주세요.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* 불러오기는 덮어쓰기다 — 반드시 확인을 받는다 */
function askImport(parsed, fileName){
  const dlg = document.getElementById('confirmDlg');

     <span style="color:var(--muted);font-size:13px">${summarize(parsed)}</span><br><br>
     이 내용으로 <b>덮어씁니다.</b> 지금 이 기기에 저장된 시간표·일정·용돈·기분·공지는
     모두 사라집니다.<br><br>
     <span style="color:var(--muted);font-size:13px">지금 기기의 내용이 더 최신이라면
     취소하고, 먼저 「백업 파일 저장」으로 보관하세요.</span>`;
  const ok = document.getElementById('confirmOk');
  ok.textContent = '덮어쓰기';
  ok.onclick = () => {

      dlg.close();

      alert('백업 파일의 내용이 올바르지 않습니다.');

}

function askReset(){
  const dlg = document.getElementById('confirmDlg');
  document.getElementById('confirmText').textContent =
    '주간 시간표가 기본값으로 돌아가고, 달력의 특별 일정도 모두 삭제됩니다. (용돈 기록은 지워지지 않습니다) 계속할까요?';

/* ---------- 탭 ---------- */
const TAB_ORDER = ['today', 'month', 'fit', 'money', 'week'];
let curTab = 'today';

/* 좌우로 밀어 탭을 넘긴다. 사진첩을 넘기는 것과 같은 방향이다.
   손가락을 왼쪽으로 끌면 오른쪽 탭(다음)이 오고,
   오른쪽으로 끌면 왼쪽 탭(이전)이 온다. 양 끝은 서로 이어져 있다.
     주간 설정에서 손가락을 왼쪽으로 끌면 오늘
     오늘에서 손가락을 오른쪽으로 끌면 주간 설정 */
(function setupSwipe(){
  let x0 = 0, y0 = 0, live = false, swiped = false;
  let scroller = null, scrollAt = 0;

  document.addEventListener('touchstart', e => {
    live = false;
    scroller = null;
    if (e.touches.length !== 1) return;
    if (document.documentElement.classList.contains('locked')) return;
    if (e.target.closest && e.target.closest('dialog')) return;
    /* 지금 편집 중인 칸 위에서 끄는 것은 글자 선택이므로 건드리지 않는다 */
    const a = document.activeElement;
    if (a === e.target && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;

    /* 주간 설정 표는 화면 전체를 덮고 있어 통째로 제외하면 스와이프가 아예 안 된다.
       실제로 표가 좌우로 움직였는지 나중에 확인해서 판단한다. */
    const sc = e.target.closest && e.target.closest('.table-scroll');
    if (sc && sc.scrollWidth > sc.clientWidth + 1){
      scroller = sc;
      scrollAt = sc.scrollLeft;
    }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    live = true;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!live) return;
    live = false;
    if (scroller && scroller.scrollLeft !== scrollAt) return;  // 표를 좌우로 본 것
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) < 55) return;                 // 너무 짧으면 무시
    if (Math.abs(dx) < Math.abs(dy) * 1.3) return; // 세로로 움직였으면 무시
    const i = TAB_ORDER.indexOf(curTab);
    const step = dx < 0 ? 1 : -1;      // 왼쪽으로 끌면 다음 탭
    showTab(TAB_ORDER[(i + step + TAB_ORDER.length) % TAB_ORDER.length], step);
    swiped = true;
    setTimeout(() => { swiped = false; }, 300);
  }, { passive: true });

  /* 민 자리에 있던 버튼이나 입력칸이 따라 눌리지 않게 막는다 */
  document.addEventListener('click', e => {
    if (!swiped) return;
    swiped = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
})();

const panelId = t => 'panel' + t[0].toUpperCase() + t.slice(1);
let leaveTimer = null;

/* dir 을 주면 그 방향으로 넘어간다. 안 주면 탭 순서로 알아서 정한다.
   나가는 화면은 한쪽으로 밀려나가고 새 화면이 반대쪽에서 들어온다. */
function showTab(which, dir){
  if (dir === undefined){
    const from = TAB_ORDER.indexOf(curTab), to = TAB_ORDER.indexOf(which);
    dir = to >= from ? 1 : -1;
  }
  const panel = document.getElementById(panelId(which));
  const prev = document.getElementById(panelId(curTab));

  /* 빠르게 여러 번 넘길 때 이전 잔상이 남지 않게 먼저 정리한다 */
  clearTimeout(leaveTimer);
  for (const p of document.querySelectorAll('.panel.leaving')){
    p.classList.remove('leaving');
    p.style.removeProperty('--slide');
  }

  if (prev && prev !== panel){
    prev.style.setProperty('--slide', (dir > 0 ? -100 : 100) + '%');
    prev.classList.add('leaving');
    leaveTimer = setTimeout(() => {
      prev.classList.remove('leaving');
      prev.style.removeProperty('--slide');
    }, 280);
  }
  panel.style.setProperty('--slide', (dir > 0 ? 100 : -100) + '%');

  curTab = which;
  for (const t of TAB_ORDER){
    const on = t === which;
    document.getElementById('panel' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', on);
    document.getElementById('tab'   + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', on);
  }
}

document.getElementById('mDate').value = ymdOf(new Date());
setKind('in');

/* ---------- 첫 화면 ---------- */
/* 사진이 서서히 나타났다가 1.5초쯤 뒤에 사라진다.
   사진 파일이 없으면 기다리지 않고 바로 넘어간다. */
const splashDone = (function setupSplash(){
  const el = document.getElementById('splash');
  if (!el) return Promise.resolve();
  const img = document.getElementById('splashImg');
  return new Promise(resolve => {
    let alive = true;
    const finish = fade => {
      if (!alive) return;
      alive = false;
      if (!fade){ el.remove(); resolve(); return; }
      el.classList.add('out');
      setTimeout(() => { el.remove(); resolve(); }, 400);
    };
    img.addEventListener('error', () => finish(false));   // 사진이 없으면 바로 넘어간다
    setTimeout(() => finish(true), 1150);                 // 화면에 머무는 시간 약 1.5초
  });
})();

/* ---------- 비밀번호 잠금 ---------- */
(function setupLock(){
  const box = document.getElementById('lockScreen');
  const input = document.getElementById('lockInput');
  const msg = document.getElementById('lockMsg');
  const isLocked = () => document.documentElement.classList.contains('locked');

  /* 첫 화면이 떠 있는 동안에는 자판이 올라오지 않도록, 끝난 뒤에 커서를 놓는다 */
  if (isLocked()) splashDone.then(() => setTimeout(() => input.focus(), 60));

  input.addEventListener('input', () => {
    const v = input.value.replace(/[^0-9]/g, '');
    if (v !== input.value) input.value = v;
    msg.classList.remove('err');
    if (v.length < 6) return;

    const code = LOCK.hash(v);
    const role = LOCK.roleOf(code);
    if (role){
      try { localStorage.setItem(LOCK.KEY, code); } catch (e) {}
      document.documentElement.classList.remove('locked');
      document.documentElement.classList.toggle('admin', role === 'admin');
      input.value = '';
      input.blur();
      msg.textContent = '이 기기에서는 처음 한 번만 입력하면 됩니다';
      renderNotice();                   // 권한에 따라 수정 버튼이 달라진다
      renderToday();                    // 잠금 중 멈춰 있던 화면을 새로 맞춘다
    } else {
      box.classList.add('shake');
      setTimeout(() => box.classList.remove('shake'), 400);
      msg.textContent = '비밀번호가 맞지 않습니다';
      msg.classList.add('err');
      input.value = '';
    }
  });
})();

function renderAll(){
  if (!noticeEditing) renderNotice();   // 입력 중인 공지는 건드리지 않는다
  renderToday(); renderMonth(); renderFit(); renderMoney(); renderWeek();
}

/* ---------- 동기화 계층과의 연결 ---------- */
const SYNC_LABEL = {
  local:      ['#9ca3af', '이 기기에만 저장'],
  connecting: ['#f59e0b', '연결 중…'],
  live:       ['#10b981', '실시간 동기화 중'],
  error:      ['#ef4444', '동기화 오류'],
};
function setSyncStatus(state, detail){
  const [color, label] = SYNC_LABEL[state] || SYNC_LABEL.local;
  const el = document.getElementById('syncBadge');
  el.innerHTML = `<i style="background:${color}"></i><span>${label}</span>`;
  el.title = detail ? `${label} — ${detail}` : label;
}

window.familyApp = {
  setSyncStatus,
  /* 원격으로 보낼 전체 스냅샷 */
  snapshot: () => ({ weekly: data, events, money, moods, says, fit, notice }),
  /* 원격에서 받은 내용을 로컬에 반영 (되돌려 보내지 않는다) */
  apply(remote){
    if (!remote || typeof remote !== 'object') return;
    if (remote.weekly) { data   = mergeWeekly(remote.weekly);  put(STORE_KEY,  data); }
    if (remote.events) { events = cleanEvents(remote.events);   put(EVENTS_KEY, events); }
    if (remote.money)  { money  = cleanMoney(remote.money);     put(MONEY_KEY,  money); }
    if (remote.moods)  { moods  = cleanMoods(remote.moods);     put(MOOD_KEY,   moods); }
    if (remote.says)   { says   = cleanSays(remote.says);       put(SAYS_KEY,   says); }
    if (remote.fit)    { fit    = cleanFit(remote.fit);         put(FIT_KEY,    fit); }
    if (typeof remote.notice === 'string'){
      notice = remote.notice.slice(0, 500);
      try{ localStorage.setItem(NOTICE_KEY, notice); }catch(e){}
    }
    renderAll();
  },
  /* 동기화 계층이 자신의 push 함수를 여기에 등록한다 */
  set onChange(fn){ onLocalChange = fn; },
  get onChange(){ return onLocalChange; },
};

setSyncStatus('local');
renderNotice();
renderToday();
renderMonth();
renderFit();
renderMoney();
renderWeek();
setInterval(renderToday, 60000);   // 1분마다 상태 갱신

/* 서비스워커 등록 — 안드로이드에서 독립된 앱으로 설치되게 해준다.
   file:// 로 열었거나 지원하지 않는 브라우저면 조용히 넘어간다. */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

<!-- ══════════════════════════════════════════════════════════════════════════
     실시간 동기화 계층
     FIREBASE_CONFIG 가 비어 있으면 아무것도 하지 않고 로컬 전용으로 남는다.
     ══════════════════════════════════════════════════════════════════════════ -->
<script type="module">
const cfg = window.SUPABASE_CONFIG || {};
const app = window.familyApp;
const ROW = cfg.familyId || 'lhk-family';

/* 내가 보낸 변경이 되돌아왔을 때 무시하기 위한 기기 식별자 */
const ME = Math.random().toString(36).slice(2) + Date.now().toString(36);

if (!cfg.url || !cfg.anonKey){
  app.setSyncStatus('local', '동기화 설정이 비어 있습니다');
} else {
  app.setSyncStatus('connecting');
  try{
    const { createClient } =
      await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const sb = createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false } });

    let applying = false;   // 원격 반영 중에는 되돌려 보내지 않는다
    let timer = null;

    async function push(){
      const { error } = await sb.from('family_state').upsert({
        id: ROW,
        data: app.snapshot(),
        writer: ME,
        updated_at: new Date().toISOString(),
      });
      if (error) app.setSyncStatus('error', error.message);
    }

    app.onChange = () => {
      if (applying) return;
      clearTimeout(timer);
      timer = setTimeout(push, 500);   // 연속 입력을 묶어서 한 번에 전송
    };

    function receive(row){
      if (!row || row.writer === ME) return;   // 내가 보낸 것은 무시
      applying = true;
      try{ app.apply(row.data); } finally { applying = false; }
    }

    /* 첫 로드 — 서버에 내용이 있으면 그것을 따르고, 없으면 이 기기 내용으로 시작 */
    const { data: row, error } = await sb
      .from('family_state').select('data, writer').eq('id', ROW).maybeSingle();
    if (error) throw error;
    if (row){
      applying = true;
      try{ app.apply(row.data); } finally { applying = false; }
    } else {
      await push();
    }

    /* 이후 변경을 실시간으로 수신 */
    sb.channel('family-state')
      .on('postgres_changes',
          { event: '*', schema: 'public', table: 'family_state', filter: `id=eq.${ROW}` },
          payload => receive(payload.new))
      .subscribe(status => {
        if (status === 'SUBSCRIBED')       app.setSyncStatus('live');
        else if (status === 'CHANNEL_ERROR') app.setSyncStatus('error', '실시간 연결 실패');
        else if (status === 'TIMED_OUT')     app.setSyncStatus('error', '연결 시간 초과');
      });

  }catch(e){
    app.setSyncStatus('error', e.message || String(e));
  }
}
</script>
